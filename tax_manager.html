<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>稅務管理 — 會計系統</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans TC', sans-serif; }
.back-nav {
  position: fixed; top: 12px; left: 12px; z-index: 1000;
  padding: 6px 14px; border-radius: 8px;
  background: rgba(30,30,50,0.9); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  color: #a0a0a0; text-decoration: none; font-size: 13px;
}
.back-nav:hover { color: #fff; background: rgba(50,50,80,0.9); }
</style>
</head>
<body>
<a href="index.html" class="back-nav">← 返回首頁</a>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;


const TAX_TYPES = [
  { id: "vat", label: "營業稅", color: "#185FA5", bg: "#E6F1FB", period: "雙月申報", day: 15 },
  { id: "income_corp", label: "營利事業所得稅", color: "#0F6E56", bg: "#E1F5EE", period: "年度申報" },
  { id: "income_withhold", label: "扣繳申報", color: "#854F0B", bg: "#FAEEDA", period: "年度申報" },
  { id: "income_prepay", label: "暫繳所得稅", color: "#A32D2D", bg: "#FCEBEB", period: "年度申報" },
  { id: "land_value", label: "地價稅", color: "#3B6D11", bg: "#EAF3DE", period: "年度課徵" },
  { id: "house", label: "房屋稅", color: "#993C1D", bg: "#FAECE7", period: "年度課徵" },
  { id: "nhi_supplement", label: "二代健保補充保費", color: "#534AB7", bg: "#EEEDFE", period: "季繳" },
  { id: "labor_insurance", label: "勞保費", color: "#5F5E5A", bg: "#F1EFE8", period: "月繳" },
  { id: "other", label: "其他稅費", color: "#5F5E5A", bg: "#F1EFE8", period: "自訂" },
];

const DEFAULT_COMPANIES = [
  { id: "c1", name: "張哲維建築師事務所", shortName: "建築事務所", taxId: "00000001", color: "#185FA5", bg: "#E6F1FB" },
  { id: "c2", name: "巨揚設計有限公司", shortName: "巨揚設計", taxId: "00000002", color: "#0F6E56", bg: "#E1F5EE" },
];

function getDaysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function urgencyStyle(days) {
  if (days < 0) return { label: "已逾期", bg: "#FCEBEB", color: "#A32D2D", border: "#F09595" };
  if (days <= 3) return { label: "緊急", bg: "#FCEBEB", color: "#A32D2D", border: "#F09595" };
  if (days <= 7) return { label: "即將到期", bg: "#FAEEDA", color: "#854F0B", border: "#EF9F27" };
  if (days <= 30) return { label: "注意", bg: "#FAEEDA", color: "#633806", border: "#FAC775" };
  return { label: "正常", bg: "#EAF3DE", color: "#3B6D11", border: "#97C459" };
}

function generateVATDeadlines(year) {
  // 1-2月→3/15, 3-4月→5/15, 5-6月→7/15, 7-8月→9/15, 9-10月→11/15, 11-12月→次年1/15
  const periods = [
    { m1:1, m2:2, deadlineMonth:3, deadlineYear:year },
    { m1:3, m2:4, deadlineMonth:5, deadlineYear:year },
    { m1:5, m2:6, deadlineMonth:7, deadlineYear:year },
    { m1:7, m2:8, deadlineMonth:9, deadlineYear:year },
    { m1:9, m2:10, deadlineMonth:11, deadlineYear:year },
    { m1:11, m2:12, deadlineMonth:1, deadlineYear:year+1 },
  ];
  return periods.map(p => ({
    id: `vat-${year}-${p.m1}${p.m2}`,
    taxTypeId: "vat",
    title: `${year}年${p.m1}~${p.m2}月份營業稅申報`,
    dueDate: `${p.deadlineYear}-${String(p.deadlineMonth).padStart(2,'0')}-15`,
    amount: null,
    note: `申報${year}年${p.m1}~${p.m2}月份銷售額`,
    filed: false,
    paid: false,
  }));
}

function generateAnnualDeadlines(year) {
  return [
    { id:`withhold-${year}`, taxTypeId:"income_withhold", title:`${year}年扣繳憑單申報`, dueDate:`${year}-01-31`, amount:null, note:"申報前一年度各類所得扣繳", filed:false, paid:false },
    { id:`house-${year}`, taxTypeId:"house", title:`${year}年房屋稅繳納`, dueDate:`${year}-05-31`, amount:null, note:"依稅單繳納", filed:false, paid:false },
    { id:`income-corp-${year}`, taxTypeId:"income_corp", title:`${year}年營利事業所得稅申報`, dueDate:`${year}-05-31`, amount:null, note:"年度結算申報", filed:false, paid:false },
    { id:`prepay-${year}`, taxTypeId:"income_prepay", title:`${year}年營所稅暫繳`, dueDate:`${year}-09-30`, amount:null, note:"上半年度暫繳", filed:false, paid:false },
    { id:`land-${year}`, taxTypeId:"land_value", title:`${year}年地價稅繳納`, dueDate:`${year}-11-30`, amount:null, note:"依稅單繳納", filed:false, paid:false },
  ];
}

function initEvents() {
  const year = new Date().getFullYear();
  return [...generateVATDeadlines(year), ...generateVATDeadlines(year+1).slice(0,2),
          ...generateAnnualDeadlines(year), ...generateAnnualDeadlines(year+1).slice(0,2)];
}

const STORAGE_KEY = "tax_manager_v4";

function TaxManager() {
  const [companies, setCompanies] = useState(DEFAULT_COMPANIES);
  const [selectedCompanyId, setSelectedCompanyId] = useState("c1");
  const [companyEvents, setCompanyEvents] = useState({ c1: initEvents(), c2: initEvents() });
  const [view, setView] = useState("dashboard");
  const [filter, setFilter] = useState("all");
  const [showAddModal, setShowAddModal] = useState(false);
  const [showAddCompanyModal, setShowAddCompanyModal] = useState(false);
  const [editingEvent, setEditingEvent] = useState(null);
  const [aiQuery, setAiQuery] = useState("");
  const [aiResponse, setAiResponse] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [notification, setNotification] = useState(null);
  const aiInputRef = useRef(null);

  const [newEvent, setNewEvent] = useState({
    taxTypeId: "vat", title: "", dueDate: "", amount: "", note: "", filed: false, paid: false
  });
  const [newCompany, setNewCompany] = useState({ name: "", shortName: "", taxId: "", color: "#185FA5", bg: "#E6F1FB" });

  useEffect(() => {
    (async () => {
      try {
        const r = { value: localStorage.getItem(STORAGE_KEY) };
        if (r?.value) {
          const d = JSON.parse(r.value);
          if (d.companies) setCompanies(d.companies);
          if (d.companyEvents) setCompanyEvents(d.companyEvents);
          if (d.selectedCompanyId) setSelectedCompanyId(d.selectedCompanyId);
        }
      } catch {}
      setLoaded(true);
    })();
  }, []);

  const save = useCallback(async (cos, evs, selId) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ companies: cos, companyEvents: evs, selectedCompanyId: selId }));
    } catch {}
  }, []);

  useEffect(() => {
    if (loaded) save(companies, companyEvents, selectedCompanyId);
  }, [companies, companyEvents, selectedCompanyId, loaded, save]);

  const selectedCompany = companies.find(c => c.id === selectedCompanyId) || companies[0];
  const events = (companyEvents[selectedCompanyId] || []).sort((a,b) => new Date(a.dueDate)-new Date(b.dueDate));

  const filteredEvents = events.filter(e => {
    if (filter === "pending") return !e.filed || !e.paid;
    if (filter === "overdue") return getDaysUntil(e.dueDate) < 0 && (!e.filed || !e.paid);
    if (filter === "upcoming") { const d = getDaysUntil(e.dueDate); return d >= 0 && d <= 30; }
    if (filter === "done") return e.filed && e.paid;
    return true;
  });

  const stats = {
    total: events.length,
    overdue: events.filter(e => getDaysUntil(e.dueDate) < 0 && (!e.filed || !e.paid)).length,
    upcoming: events.filter(e => { const d = getDaysUntil(e.dueDate); return d >= 0 && d <= 30 && (!e.filed || !e.paid); }).length,
    done: events.filter(e => e.filed && e.paid).length,
  };

  function notify(msg, type="success") {
    setNotification({ msg, type });
    setTimeout(() => setNotification(null), 2500);
  }

  function updateEvent(id, patch) {
    setCompanyEvents(prev => ({ ...prev, [selectedCompanyId]: prev[selectedCompanyId].map(e => e.id===id ? {...e,...patch} : e) }));
  }

  function deleteEvent(id) {
    setCompanyEvents(prev => ({ ...prev, [selectedCompanyId]: prev[selectedCompanyId].filter(e => e.id!==id) }));
    notify("已刪除事項");
  }

  function addEvent() {
    if (!newEvent.title || !newEvent.dueDate) return;
    const ev = { ...newEvent, id: `custom-${Date.now()}`, amount: newEvent.amount ? parseFloat(newEvent.amount) : null };
    setCompanyEvents(prev => ({ ...prev, [selectedCompanyId]: [...(prev[selectedCompanyId]||[]), ev] }));
    setNewEvent({ taxTypeId:"vat", title:"", dueDate:"", amount:"", note:"", filed:false, paid:false });
    setShowAddModal(false);
    notify("已新增稅務事項");
  }

  function addCompany() {
    if (!newCompany.name) return;
    const c = { ...newCompany, id: `c${Date.now()}`, shortName: newCompany.shortName || newCompany.name.slice(0,6) };
    setCompanies(prev => [...prev, c]);
    setCompanyEvents(prev => ({ ...prev, [c.id]: initEvents() }));
    setSelectedCompanyId(c.id);
    setNewCompany({ name:"", shortName:"", taxId:"", color:"#185FA5", bg:"#E6F1FB" });
    setShowAddCompanyModal(false);
    notify(`已新增 ${c.name}`);
  }

  async function askAI() {
    if (!aiQuery.trim()) return;
    setAiLoading(true);
    setAiResponse("");
    const context = `你是台灣稅務助理，專門協助建築師事務所和建設公司。目前公司：${selectedCompany.name}。即將到期事項：${events.filter(e=>{ const d=getDaysUntil(e.dueDate); return d>=0&&d<=60&&(!e.filed||!e.paid); }).map(e=>`${e.title}(${e.dueDate})`).join('、') || '無'}。請用繁體中文回答，簡潔明瞭。`;
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000, system:context, messages:[{role:"user",content:aiQuery}] })
      });
      const data = await res.json();
      setAiResponse(data.content?.[0]?.text || "無法取得回應");
    } catch { setAiResponse("連線失敗，請稍後再試。"); }
    setAiLoading(false);
  }

  const taxTypeMap = Object.fromEntries(TAX_TYPES.map(t => [t.id, t]));

  const colorOptions = [
    { color:"#185FA5", bg:"#E6F1FB" },
    { color:"#0F6E56", bg:"#E1F5EE" },
    { color:"#854F0B", bg:"#FAEEDA" },
    { color:"#A32D2D", bg:"#FCEBEB" },
    { color:"#534AB7", bg:"#EEEDFE" },
    { color:"#993C1D", bg:"#FAECE7" },
  ];

  if (!loaded) return <div style={{padding:"2rem",color:"var(--color-text-secondary)",fontSize:14}}>載入中…</div>;

  return (
    <div style={{display:"flex",minHeight:"100vh",fontFamily:"var(--font-sans)",fontSize:14,background:"var(--color-background-tertiary)"}}>
      {/* Sidebar */}
      <aside style={{width:220,borderRight:"0.5px solid var(--color-border-tertiary)",background:"var(--color-background-primary)",display:"flex",flexDirection:"column",padding:"1rem 0",flexShrink:0}}>
        <div style={{padding:"0 1rem 1rem",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
          <div style={{fontSize:13,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:8,letterSpacing:1}}>公司帳戶</div>
          {companies.map(c => (
            <div key={c.id} onClick={() => setSelectedCompanyId(c.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:"var(--border-radius-md)",cursor:"pointer",marginBottom:2,background:selectedCompanyId===c.id ? c.bg : "transparent",border:selectedCompanyId===c.id ? `0.5px solid ${c.color}40` : "0.5px solid transparent",transition:"all 0.15s"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:c.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"white",fontWeight:500,flexShrink:0}}>{c.shortName.slice(0,2)}</div>
              <div style={{overflow:"hidden"}}>
                <div style={{fontSize:12,fontWeight:500,color:selectedCompanyId===c.id?c.color:"var(--color-text-primary)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.shortName}</div>
                {c.taxId && <div style={{fontSize:10,color:"var(--color-text-tertiary)"}}>{c.taxId}</div>}
              </div>
            </div>
          ))}
          <button onClick={() => setShowAddCompanyModal(true)} style={{width:"100%",marginTop:6,padding:"6px 10px",fontSize:12,color:"var(--color-text-secondary)",background:"transparent",border:"0.5px dashed var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",cursor:"pointer",textAlign:"left"}}>+ 新增公司</button>
        </div>
        <div style={{padding:"1rem 1rem 0"}}>
          <div style={{fontSize:13,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:6,letterSpacing:1}}>功能</div>
          {[["dashboard","總覽"],["list","稅務清單"],["ai","AI 稅務顧問"]].map(([v,label]) => (
            <div key={v} onClick={() => setView(v)} style={{padding:"7px 10px",borderRadius:"var(--border-radius-md)",cursor:"pointer",fontSize:13,color:view===v?"var(--color-text-primary)":"var(--color-text-secondary)",background:view===v?"var(--color-background-secondary)":"transparent",fontWeight:view===v?500:400,marginBottom:2}}>{label}</div>
          ))}
        </div>
      </aside>

      {/* Main */}
      <main style={{flex:1,overflow:"auto"}}>
        {/* Header */}
        <div style={{padding:"1rem 1.5rem",borderBottom:"0.5px solid var(--color-border-tertiary)",background:"var(--color-background-primary)",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:selectedCompany.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"white",fontWeight:500}}>{selectedCompany.shortName.slice(0,2)}</div>
            <div>
              <div style={{fontWeight:500,fontSize:15,color:"var(--color-text-primary)"}}>{selectedCompany.name}</div>
              <div style={{fontSize:11,color:"var(--color-text-tertiary)"}}>統一編號 {selectedCompany.taxId || "未設定"}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {stats.overdue > 0 && <span style={{fontSize:11,padding:"4px 10px",borderRadius:20,background:"#FCEBEB",color:"#A32D2D",fontWeight:500}}>{stats.overdue} 筆逾期</span>}
            {stats.upcoming > 0 && <span style={{fontSize:11,padding:"4px 10px",borderRadius:20,background:"#FAEEDA",color:"#854F0B",fontWeight:500}}>{stats.upcoming} 筆即將到期</span>}
            <button onClick={() => setShowAddModal(true)} style={{padding:"6px 14px",fontSize:13,background:selectedCompany.color,color:"white",border:"none",borderRadius:"var(--border-radius-md)",cursor:"pointer",fontWeight:500}}>+ 新增事項</button>
          </div>
        </div>

        <div style={{padding:"1.5rem"}}>
          {/* Dashboard */}
          {view === "dashboard" && (
            <div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:12,marginBottom:"1.5rem"}}>
                {[
                  {label:"全部事項",value:stats.total,bg:"var(--color-background-secondary)",color:"var(--color-text-primary)"},
                  {label:"逾期未處理",value:stats.overdue,bg:"#FCEBEB",color:"#A32D2D"},
                  {label:"30天內到期",value:stats.upcoming,bg:"#FAEEDA",color:"#854F0B"},
                  {label:"已完成",value:stats.done,bg:"#EAF3DE",color:"#3B6D11"},
                ].map(s => (
                  <div key={s.label} style={{background:s.bg,borderRadius:"var(--border-radius-md)",padding:"1rem",border:"0.5px solid var(--color-border-tertiary)"}}>
                    <div style={{fontSize:12,color:s.color,opacity:0.8,marginBottom:6}}>{s.label}</div>
                    <div style={{fontSize:28,fontWeight:500,color:s.color}}>{s.value}</div>
                  </div>
                ))}
              </div>

              <div style={{marginBottom:"1rem",fontWeight:500,fontSize:15}}>近期待辦</div>
              {events.filter(e => { const d=getDaysUntil(e.dueDate); return d>=-30 && d<=60 && (!e.filed||!e.paid); }).slice(0,6).map(e => (
                <EventCard key={e.id} event={e} taxType={taxTypeMap[e.taxTypeId]} onToggle={updateEvent} onDelete={deleteEvent} compact />
              ))}
              {events.filter(e => { const d=getDaysUntil(e.dueDate); return d>=-30 && d<=60 && (!e.filed||!e.paid); }).length === 0 && (
                <div style={{padding:"2rem",textAlign:"center",color:"var(--color-text-tertiary)",fontSize:13,background:"var(--color-background-secondary)",borderRadius:"var(--border-radius-lg)"}}>目前無近期待辦事項</div>
              )}
            </div>
          )}

          {/* List */}
          {view === "list" && (
            <div>
              <div style={{display:"flex",gap:8,marginBottom:"1rem",flexWrap:"wrap"}}>
                {[["all","全部"],["pending","待處理"],["overdue","已逾期"],["upcoming","30天內"],["done","已完成"]].map(([f,label]) => (
                  <button key={f} onClick={() => setFilter(f)} style={{padding:"5px 14px",fontSize:12,borderRadius:20,border:`0.5px solid ${filter===f ? selectedCompany.color : "var(--color-border-secondary)"}`,background:filter===f ? selectedCompany.bg : "transparent",color:filter===f ? selectedCompany.color : "var(--color-text-secondary)",cursor:"pointer",fontWeight:filter===f?500:400}}>{label}</button>
                ))}
              </div>
              {filteredEvents.length === 0 ? (
                <div style={{padding:"3rem",textAlign:"center",color:"var(--color-text-tertiary)",fontSize:13}}>無符合條件的事項</div>
              ) : filteredEvents.map(e => (
                <EventCard key={e.id} event={e} taxType={taxTypeMap[e.taxTypeId]} onToggle={updateEvent} onDelete={deleteEvent} />
              ))}
            </div>
          )}

          {/* AI */}
          {view === "ai" && (
            <div style={{maxWidth:700}}>
              <div style={{fontWeight:500,fontSize:15,marginBottom:4}}>AI 稅務顧問</div>
              <div style={{fontSize:13,color:"var(--color-text-secondary)",marginBottom:"1.5rem"}}>詢問台灣稅務相關問題，AI 會根據目前公司的資料提供建議。</div>
              <div style={{display:"flex",gap:8,marginBottom:"1rem"}}>
                <input ref={aiInputRef} value={aiQuery} onChange={e=>setAiQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&askAI()} placeholder="例：營業稅申報需要準備哪些資料？" style={{flex:1,padding:"8px 12px",fontSize:13,borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-primary)",color:"var(--color-text-primary)"}} />
                <button onClick={askAI} disabled={aiLoading} style={{padding:"8px 16px",fontSize:13,background:selectedCompany.color,color:"white",border:"none",borderRadius:"var(--border-radius-md)",cursor:"pointer",fontWeight:500,opacity:aiLoading?0.6:1}}>{aiLoading?"思考中…":"送出"}</button>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:"1.5rem"}}>
                {["營業稅申報流程","扣繳憑單申報期限","暫繳稅額如何計算","地價稅繳納注意事項"].map(q => (
                  <button key={q} onClick={() => { setAiQuery(q); setTimeout(()=>askAI(),50); }} style={{padding:"5px 12px",fontSize:12,borderRadius:20,border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",cursor:"pointer"}}>{q}</button>
                ))}
              </div>
              {aiResponse && (
                <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"1.25rem"}}>
                  <div style={{fontSize:11,color:"var(--color-text-tertiary)",marginBottom:8}}>AI 回覆 · {selectedCompany.name}</div>
                  <div style={{fontSize:13,lineHeight:1.8,color:"var(--color-text-primary)",whiteSpace:"pre-wrap"}}>{aiResponse}</div>
                </div>
              )}
            </div>
          )}
        </div>
      </main>

      {/* Add Event Modal */}
      {showAddModal && (
        <Modal title="新增稅務事項" onClose={() => setShowAddModal(false)} onConfirm={addEvent} confirmLabel="新增">
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div>
              <label style={labelStyle}>稅務類型</label>
              <select value={newEvent.taxTypeId} onChange={e=>setNewEvent(p=>({...p,taxTypeId:e.target.value}))} style={inputStyle}>
                {TAX_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </div>
            <div>
              <label style={labelStyle}>事項名稱 *</label>
              <input value={newEvent.title} onChange={e=>setNewEvent(p=>({...p,title:e.target.value}))} placeholder="例：2025年3月份營業稅申報" style={inputStyle} />
            </div>
            <div>
              <label style={labelStyle}>到期日 *</label>
              <input type="date" value={newEvent.dueDate} onChange={e=>setNewEvent(p=>({...p,dueDate:e.target.value}))} style={inputStyle} />
            </div>
            <div>
              <label style={labelStyle}>金額（元）</label>
              <input type="number" value={newEvent.amount} onChange={e=>setNewEvent(p=>({...p,amount:e.target.value}))} placeholder="選填" style={inputStyle} />
            </div>
            <div>
              <label style={labelStyle}>備註</label>
              <textarea value={newEvent.note} onChange={e=>setNewEvent(p=>({...p,note:e.target.value}))} rows={2} placeholder="選填" style={{...inputStyle,resize:"vertical"}} />
            </div>
          </div>
        </Modal>
      )}

      {/* Add Company Modal */}
      {showAddCompanyModal && (
        <Modal title="新增公司" onClose={() => setShowAddCompanyModal(false)} onConfirm={addCompany} confirmLabel="新增">
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div>
              <label style={labelStyle}>公司全名 *</label>
              <input value={newCompany.name} onChange={e=>setNewCompany(p=>({...p,name:e.target.value}))} placeholder="例：OO有限公司" style={inputStyle} />
            </div>
            <div>
              <label style={labelStyle}>簡稱（顯示用）</label>
              <input value={newCompany.shortName} onChange={e=>setNewCompany(p=>({...p,shortName:e.target.value}))} placeholder="最多6字" style={inputStyle} />
            </div>
            <div>
              <label style={labelStyle}>統一編號</label>
              <input value={newCompany.taxId} onChange={e=>setNewCompany(p=>({...p,taxId:e.target.value}))} placeholder="8碼" style={inputStyle} />
            </div>
            <div>
              <label style={labelStyle}>代表色</label>
              <div style={{display:"flex",gap:8,marginTop:4}}>
                {colorOptions.map(o => (
                  <div key={o.color} onClick={() => setNewCompany(p=>({...p,color:o.color,bg:o.bg}))} style={{width:28,height:28,borderRadius:"50%",background:o.color,cursor:"pointer",border:`2px solid ${newCompany.color===o.color?"white":"transparent"}`,outline:newCompany.color===o.color?`2px solid ${o.color}`:"none"}} />
                ))}
              </div>
            </div>
          </div>
        </Modal>
      )}

      {/* Notification */}
      {notification && (
        <div style={{position:"fixed",bottom:24,right:24,padding:"10px 18px",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",fontSize:13,color:"var(--color-text-primary)",zIndex:999,boxShadow:"0 2px 12px rgba(0,0,0,0.08)"}}>
          {notification.msg}
        </div>
      )}
    </div>
  );
}

function EventCard({ event, taxType, onToggle, onDelete, compact }) {
  const days = getDaysUntil(event.dueDate);
  const u = urgencyStyle(days);
  const done = event.filed && event.paid;

  return (
    <div style={{background:"var(--color-background-primary)",border:`0.5px solid ${done?"var(--color-border-tertiary)":u.border}`,borderRadius:"var(--border-radius-lg)",padding:compact?"12px 14px":"14px 16px",marginBottom:8,opacity:done?0.6:1,transition:"all 0.15s"}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
        <div style={{paddingTop:2,flexShrink:0}}>
          {taxType && <div style={{width:10,height:10,borderRadius:"50%",background:taxType.color,marginTop:4}} />}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
            <span style={{fontSize:13,fontWeight:500,color:"var(--color-text-primary)",textDecoration:done?"line-through":"none"}}>{event.title}</span>
            {taxType && <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:taxType.bg,color:taxType.color}}>{taxType.label}</span>}
            <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:u.bg,color:u.color,fontWeight:500}}>{days<0?`逾期${Math.abs(days)}天`:days===0?"今天到期":`${days}天後`} · {u.label}</span>
          </div>
          <div style={{fontSize:12,color:"var(--color-text-secondary)",marginBottom:compact?0:6}}>到期：{event.dueDate}{event.amount ? ` · 金額：${event.amount.toLocaleString()}元` : ""}{event.note ? ` · ${event.note}` : ""}</div>
          {!compact && (
            <div style={{display:"flex",gap:12,marginTop:8,flexWrap:"wrap"}}>
              <label style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}}>
                <input type="checkbox" checked={event.filed} onChange={e=>onToggle(event.id,{filed:e.target.checked})} style={{width:14,height:14}} />
                已申報
              </label>
              <label style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}}>
                <input type="checkbox" checked={event.paid} onChange={e=>onToggle(event.id,{paid:e.target.checked})} style={{width:14,height:14}} />
                已繳納
              </label>
              <button onClick={() => onDelete(event.id)} style={{fontSize:12,color:"#A32D2D",background:"transparent",border:"none",cursor:"pointer",padding:0}}>刪除</button>
            </div>
          )}
          {compact && (
            <div style={{display:"flex",gap:10,marginTop:6}}>
              <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,cursor:"pointer",color:"var(--color-text-secondary)"}}>
                <input type="checkbox" checked={event.filed} onChange={e=>onToggle(event.id,{filed:e.target.checked})} style={{width:12,height:12}} /> 已申報
              </label>
              <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,cursor:"pointer",color:"var(--color-text-secondary)"}}>
                <input type="checkbox" checked={event.paid} onChange={e=>onToggle(event.id,{paid:e.target.value})} style={{width:12,height:12}} /> 已繳納
              </label>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Modal({ title, onClose, onConfirm, confirmLabel, children }) {
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:"1rem"}}>
      <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-lg)",padding:"1.5rem",width:"100%",maxWidth:440,maxHeight:"90vh",overflow:"auto"}}>
        <div style={{fontWeight:500,fontSize:15,marginBottom:"1rem"}}>{title}</div>
        {children}
        <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:"1.25rem"}}>
          <button onClick={onClose} style={{padding:"7px 16px",fontSize:13,background:"transparent",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",cursor:"pointer",color:"var(--color-text-secondary)"}}>取消</button>
          <button onClick={onConfirm} style={{padding:"7px 16px",fontSize:13,background:"var(--color-text-primary)",color:"var(--color-background-primary)",border:"none",borderRadius:"var(--border-radius-md)",cursor:"pointer",fontWeight:500}}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

const inputStyle = { width:"100%", padding:"7px 10px", fontSize:13, borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-secondary)", background:"var(--color-background-primary)", color:"var(--color-text-primary)", boxSizing:"border-box" };
const labelStyle = { display:"block", fontSize:12, color:"var(--color-text-secondary)", marginBottom:4 };

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(TaxManager));
</script>
</body>
</html>
