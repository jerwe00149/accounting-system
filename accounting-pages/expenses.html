<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月支出細項 — 張哲維建築師事務所</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f2f7;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--accent:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:20px}
h1{font-size:1.4rem;margin-bottom:16px}
h1 a{font-size:.85rem;color:var(--muted);text-decoration:none;margin-left:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
select{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;background:var(--card);color:var(--text)}
.import-zone{background:rgba(99,102,241,.08);border:2px dashed rgba(99,102,241,.3);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px;cursor:pointer;transition:all .2s}
.import-zone:hover{border-color:var(--accent);background:rgba(99,102,241,.15)}
.import-zone input{display:none}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border-radius:10px;padding:12px 16px;border:1px solid var(--border);min-width:140px}
.stat .label{font-size:.75rem;color:var(--muted)}
.stat .value{font-size:1.2rem;font-weight:700;margin-top:2px}
.table-wrap{background:var(--card);border-radius:12px;overflow:auto;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{padding:10px 12px;text-align:left;background:rgba(255,255,255,.05);font-weight:600;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--border)}
.cat-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem}
.text-right{text-align:right}
.income{color:var(--green)}
.expense{color:var(--red)}
.mono{font-variant-numeric:tabular-nums}

.sidebar{width:260px;background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100}
.sidebar-header{padding:28px 20px 24px;border-bottom:1px solid rgba(255,255,255,.08);display:block;text-decoration:none;color:inherit}
.sidebar-header h1{font-size:1.25rem;font-weight:700;color:#fff}
.sidebar-header p{font-size:.85rem;color:#94a3b8;margin-top:4px}
.sidebar-nav{flex:1;padding:12px 0}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:#94a3b8;text-decoration:none;font-size:1.05rem;transition:all .2s;cursor:pointer;border-left:3px solid transparent;margin:2px 0}
.sidebar-nav a:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.sidebar-nav a.active{background:linear-gradient(90deg,rgba(79,70,229,.2),transparent);color:#fff;border-left:3px solid #4f46e5}
.sidebar-nav a .icon{font-size:1.4rem;width:24px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:.85rem;color:#475569}
.container{margin-left:260px}
@media(max-width:768px){.sidebar{display:none}.container{margin-left:0}}
</style>
</head>
<body>
<aside class="sidebar">
  <a href="/index.html" class="sidebar-header">
    <h1>張哲維建築師事務所</h1>
    <p>會計管理系統</p>
  </a>
  <nav class="sidebar-nav">
    <a href="/accounting_dashboard"><span class="icon">📊</span>總覽</a>
    <a href="/accounting_dashboard#projects"><span class="icon">🏗️</span>案件收支</a>
    <a href="/accounting_dashboard#subcontractors"><span class="icon">🤝</span>複委託管理</a>
    <a href="/monthly_expenses"><span class="icon">📝</span>月支出表</a>
    <a class="active" href="/expenses"><span class="icon">💰</span>月支出細項</a>
    <a href="/accounting_dashboard#quotation"><span class="icon">📄</span>報價單上傳</a>
    <a href="/accounting_dashboard#import"><span class="icon">📁</span>匯入資料</a>
    <a href="/accounting_dashboard#settings"><span class="icon">⚙️</span>設定</a>
  </nav>
  <div class="sidebar-footer">v1.0 · 2026</div>
</aside>
<div class="container">
  <h1>💰 月支出細項</h1>

  <div class="toolbar">
    <select id="yearSel"><option value="0">全部年份</option></select>
    <select id="monthSel"><option value="0">全部月份</option></select>
    <select id="catSel"><option value="">全部分類</option></select>
    <button class="btn btn-primary" onclick="document.getElementById('bankFile').click()">📄 匯入銀行對帳單</button>
    <input type="file" id="bankFile" accept=".xls,.xlsx" style="display:none">
    <button class="btn btn-green" onclick="openAdd()">＋ 新增</button>
    <span id="importStatus" style="font-size:.85rem;color:var(--muted)"></span>
  </div>

  <div id="statsRow" class="stats"></div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>日期</th><th>分類</th><th>摘要</th><th>對象</th>
        <th class="text-right">支出</th><th class="text-right">存入</th>
        <th class="text-right">餘額</th><th>備註</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

<!-- 編輯 Modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center">
  <div style="background:var(--card);border-radius:12px;padding:24px;width:90%;max-width:450px;border:1px solid var(--border)">
    <h2 id="editTitle" style="margin-bottom:16px;font-size:1.1rem">新增支出</h2>
    <input type="hidden" id="eId">
    <div style="margin-bottom:10px"><label style="font-size:.8rem;color:var(--muted)">日期</label><input type="date" id="eDate" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#1e293b;border-color:#e2e8f0"></div>
    <div style="margin-bottom:10px"><label style="font-size:.8rem;color:var(--muted)">會計科目</label><input id="eCat" placeholder="例：薪資、勞保費、辦公費" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#1e293b;border-color:#e2e8f0"></div>
    <div style="margin-bottom:10px"><label style="font-size:.8rem;color:var(--muted)">摘要</label><input id="eDesc" placeholder="說明" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#1e293b;border-color:#e2e8f0"></div>
    <div style="margin-bottom:10px"><label style="font-size:.8rem;color:var(--muted)">對象</label><input id="eVendor" placeholder="廠商/人員" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#1e293b;border-color:#e2e8f0"></div>
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <div style="flex:1"><label style="font-size:.8rem;color:var(--muted)">金額</label><input type="number" id="eAmt" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#1e293b;border-color:#e2e8f0"></div>
      <div><label style="font-size:.8rem;color:var(--muted)">類型</label><select id="eType" style="padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#1e293b;border-color:#e2e8f0"><option value="expense">支出</option><option value="income">存入</option></select></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-outline" onclick="closeEdit()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

</div>

<script>
let allData = [];
let serverExpenses = [];

// 會計科目分類規則
const ACCT_RULES = [
  { kw: ['勞保費','勞保'],           acct: '勞保費',   icon: '🏥', cat: '保險費' },
  { kw: ['勞退金','勞退'],           acct: '勞退金',   icon: '🏥', cat: '保險費' },
  { kw: ['健保費','健保'],           acct: '健保費',   icon: '🏥', cat: '保險費' },
  { kw: ['手續費'],                  acct: '手續費',   icon: '🏦', cat: '手續費' },
  { kw: ['電話費','話費','88659906'], acct: '電話費',   icon: '📞', cat: '通訊費' },
  { kw: ['電匯'],                    acct: '匯款',     icon: '💸', cat: '匯款' },
  { kw: ['房租','租金','陳家琦'],     acct: '房租',     icon: '🏠', cat: '租金' },
  { kw: ['帳款','結構技師'],          acct: '工程款',   icon: '🏗️', cat: '複委託費' },
  { kw: ['中酉'],                    acct: '中酉工程', icon: '🏗️', cat: '複委託費' },
  { kw: ['詠翊'],                    acct: '詠翊',     icon: '🏗️', cat: '複委託費' },
  { kw: ['旭承'],                    acct: '旭承',     icon: '🏗️', cat: '複委託費' },
  { kw: ['西艾迪'],                  acct: '西艾迪',   icon: '🏗️', cat: '複委託費' },
  { kw: ['記帳士','聚成'],           acct: '記帳士',   icon: '📋', cat: '會計費' },
  { kw: ['扶輪社','社團'],           acct: '社團',     icon: '🤝', cat: '交際費' },
  { kw: ['范嘉富'],                  acct: '薪資-范嘉富', icon: '👥', cat: '薪資' },
  { kw: ['鍾宜娟'],                  acct: '薪資-鍾宜娟', icon: '👥', cat: '薪資' },
  { kw: ['張哲維'],                  acct: '薪資-張哲維', icon: '👤', cat: '薪資' },
  { kw: ['孫怡芬'],                  acct: '薪資-孫怡芬', icon: '👥', cat: '薪資' },
  { kw: ['陳盈秀'],                  acct: '陳盈秀',   icon: '👤', cat: '複委託費' },
  { kw: ['鄭益賢'],                  acct: '鄭益賢',   icon: '👤', cat: '複委託費' },
  { kw: ['黃明煌'],                  acct: '黃明煌',   icon: '👤', cat: '複委託費' },
  { kw: ['巨揚','借址'],             acct: '巨揚設計', icon: '🏢', cat: '關係企業' },
  { kw: ['和潤','ACH'],              acct: '車貸',     icon: '🚗', cat: '貸款' },
  { kw: ['影印','文具','周先生'],     acct: '辦公費',   icon: '🖨️', cat: '辦公費' },
  { kw: ['交換票','交'],              acct: '票據',     icon: '📝', cat: '票據' },
  { kw: ['高鐵'],                    acct: '高鐵',     icon: '🚄', cat: '複委託費' },
  { kw: ['114年度','AP'],             acct: '收入',     icon: '💰', cat: '收入' },
  { kw: ['網路轉帳','網路匯款','ATM'], acct: '轉帳',   icon: '💸', cat: '轉帳' },
];

function classify(text, group) {
  // 優先使用費用編組
  if (group) {
    for (var r of ACCT_RULES) {
      for (var k of r.kw) {
        if (group.indexOf(k) >= 0) return r;
      }
    }
    return { acct: group.replace(/[()（）]/g,''), icon: '🏷️', cat: group.replace(/[()（）]/g,'') };
  }
  // 自動分類
  for (var r of ACCT_RULES) {
    for (var k of r.kw) {
      if (text.indexOf(k) >= 0) return r;
    }
  }
  return { acct: '其他', icon: '📌', cat: '其他' };
}

function parseDate(d) {
  var s = String(d).trim();
  var m = s.match(/(\d{2,3})-(\d{2})-(\d{2})/);
  if (m) return (parseInt(m[1]) + 1911) + '-' + m[2] + '-' + m[3];
  return s;
}

function parseNum(v) {
  return parseFloat(String(v || '').replace(/,/g, '').replace(/\s/g, '')) || 0;
}

function fmt(n) { return n ? n.toLocaleString() : ''; }

// 匯入銀行對帳單
document.getElementById('bankFile').addEventListener('change', function() {
  var file = this.files[0];
  if (!file) return;
  document.getElementById('importStatus').textContent = '讀取中...';

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var binary = '';
      for (var i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
      var wb = XLSX.read(binary, { type: 'binary', codepage: 950 });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      processBank(rows);
    } catch (err) {
      document.getElementById('importStatus').textContent = '❌ ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
});

function processBank(rows) {
  if (rows.length < 2) { document.getElementById('importStatus').textContent = '無資料'; return; }

  // 保留原有資料，只加入銀行新資料
  var bankData = [];
  for (var i = 1; i < rows.length; i++) {
    var row = rows[i];
    if (!row || !row[0]) continue;

    var date = parseDate(row[0]);
    var summary = String(row[2] || '').trim();
    var note = String(row[3] || '').trim();
    var expAmt = parseNum(row[4]);
    var incAmt = parseNum(row[5]);
    var balance = parseNum(row[6]);
    var remark = String(row[7] || '').trim();
    var group = (row.length > 11) ? String(row[11] || '').trim() : '';

    if (!expAmt && !incAmt) continue;

    var fullText = summary + ' ' + note + ' ' + remark;
    var cls = classify(fullText, group);

    bankData.push({
      date: date,
      acct: cls.acct,
      icon: cls.icon,
      cat: cls.cat,
      summary: summary + (note ? ' ' + note : ''),
      target: remark.replace(/\(.+\).*/, '').substring(0, 20),
      expense: expAmt,
      income: incAmt,
      balance: balance,
      remark: remark.substring(0, 30),
    });
  }

  // 合併：原有資料 + 銀行資料（去重）
  var existingDates = new Set(allData.map(function(d){ return d.date+d.expense+d.income; }));
  var added = 0;
  bankData.forEach(function(d) {
    var key = d.date+d.expense+d.income;
    if (!existingDates.has(key)) { allData.push(d); added++; }
  });
  document.getElementById('importStatus').textContent = '✅ 匯入 ' + added + ' 筆，儲存中...';
  // 儲存到伺服器
  saveBankToServer(bankData).then(function() {
    document.getElementById('importStatus').textContent = '✅ 匯入 ' + added + ' 筆（已儲存）';
  });
  buildFilters();
  render();
}

function buildFilters() {
  var years = new Set(), cats = new Set();
  allData.forEach(function(d) {
    if (d.date) years.add(d.date.substring(0, 4));
    if (d.cat) cats.add(d.cat);
  });

  var ys = document.getElementById('yearSel');
  ys.innerHTML = '<option value="0">全部年份</option>';
  Array.from(years).sort().forEach(function(y) { ys.innerHTML += '<option value="' + y + '">' + y + '年</option>'; });

  var ms = document.getElementById('monthSel');
  ms.innerHTML = '<option value="0">全部月份</option>';
  for (var m = 1; m <= 12; m++) ms.innerHTML += '<option value="' + m + '">' + m + '月</option>';

  var cs = document.getElementById('catSel');
  cs.innerHTML = '<option value="">全部分類</option>';
  Array.from(cats).sort().forEach(function(c) { cs.innerHTML += '<option value="' + c + '">' + c + '</option>'; });
}

function getFiltered() {
  var y = document.getElementById('yearSel').value;
  var m = document.getElementById('monthSel').value;
  var c = document.getElementById('catSel').value;

  return allData.filter(function(d) {
    if (y !== '0' && !d.date.startsWith(y)) return false;
    if (m !== '0' && parseInt(d.date.substring(5, 7)) !== parseInt(m)) return false;
    if (c && d.cat !== c) return false;
    return true;
  });
}

function render() {
  var filtered = getFiltered();

  // Stats
  var totalExp = 0, totalInc = 0;
  var catTotals = {};
  filtered.forEach(function(d) {
    totalExp += d.expense;
    totalInc += d.income;
    if (d.expense) catTotals[d.cat] = (catTotals[d.cat] || 0) + d.expense;
  });

  var statsHtml = '<div class="stat"><div class="label">總支出</div><div class="value expense">$' + fmt(totalExp) + '</div></div>';
  statsHtml += '<div class="stat"><div class="label">總存入</div><div class="value income">$' + fmt(totalInc) + '</div></div>';
  statsHtml += '<div class="stat"><div class="label">筆數</div><div class="value">' + filtered.length + '</div></div>';

  // Top categories
  var sorted = Object.entries(catTotals).sort(function(a, b) { return b[1] - a[1]; });
  sorted.slice(0, 4).forEach(function(pair) {
    statsHtml += '<div class="stat"><div class="label">' + pair[0] + '</div><div class="value">$' + fmt(pair[1]) + '</div></div>';
  });

  document.getElementById('statsRow').innerHTML = statsHtml;

  // Table
  var tb = document.getElementById('tbody');
  if (!filtered.length) {
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--muted)">上傳銀行對帳單（XLS）即可自動分類</td></tr>';
    return;
  }

  tb.innerHTML = filtered.sort(function(a,b){ return b.date.localeCompare(a.date); }).map(function(d) {
    return '<tr>' +
      '<td>' + d.date + '</td>' +
      '<td><span class="cat-tag" style="background:rgba(99,102,241,.15);color:#818cf8">' + d.icon + ' ' + d.acct + '</span></td>' +
      '<td>' + d.summary + '</td>' +
      '<td style="font-size:.8rem;color:var(--muted)">' + d.target + '</td>' +
      '<td class="text-right mono expense">' + (d.expense ? '$' + fmt(d.expense) : '') + '</td>' +
      '<td class="text-right mono income">' + (d.income ? '$' + fmt(d.income) : '') + '</td>' +
      '<td class="text-right mono">$' + fmt(d.balance) + '</td>' +
      '<td style="font-size:.75rem;color:var(--muted)">' + d.remark + '</td>' +
      '<td style="white-space:nowrap"><button onclick="openEdit(' + allData.indexOf(d) + ')" style="padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--muted);cursor:pointer;font-size:.75rem">✏️</button> <button onclick="delEntry(' + allData.indexOf(d) + ')" style="padding:2px 8px;border:1px solid #ef444444;border-radius:4px;background:var(--card);color:#ef4444;cursor:pointer;font-size:.75rem">✕</button></td>' +
      '</tr>';
  }).join('');
}

// Filter change
document.getElementById('yearSel').onchange = render;
document.getElementById('monthSel').onchange = render;
document.getElementById('catSel').onchange = render;

// 啟動時載入已儲存的支出資料
fetch('/api/expenses').then(function(r) { return r.json(); }).then(function(data) {
  serverExpenses = data;
  data.forEach(function(e) {
    allData.push({
      date: e.date || '',
      acct: e.category || '其他',
      icon: '📌',
      cat: e.category || '其他',
      summary: e.description || '',
      target: e.vendor || '',
      expense: e.amount || 0,
      income: 0,
      balance: 0,
      remark: e.invoiceNo || '',
      source: 'manual'
    });
  });
  buildFilters();
  render();
}).catch(function() { render(); });



async function saveBankToServer(entries) {
  for (var e of entries) {
    try {
      await fetch('/api/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          date: e.date,
          category: e.acct,
          vendor: e.target || e.remark,
          description: e.summary,
          amount: e.expense || e.income,
          tax: 0,
          invoiceNo: '',
          paymentMethod: e.expense ? '支出' : '存入',
          payDate: e.date,
          source: 'bank_import'
        })
      });
    } catch(err) { console.error('save error:', err); }
  }
}

// 新增/編輯 Modal
function openAdd() {
  document.getElementById('editModal').style.display = 'flex';
  document.getElementById('editTitle').textContent = '新增支出';
  document.getElementById('eId').value = '';
  document.getElementById('eDate').value = new Date().toISOString().substring(0,10);
  document.getElementById('eCat').value = '';
  document.getElementById('eDesc').value = '';
  document.getElementById('eVendor').value = '';
  document.getElementById('eAmt').value = '';
  document.getElementById('eType').value = 'expense';
}

function openEdit(idx) {
  var d = allData[idx];
  if (!d) return;
  document.getElementById('editModal').style.display = 'flex';
  document.getElementById('editTitle').textContent = '修改資料';
  document.getElementById('eId').value = idx;
  document.getElementById('eDate').value = d.date;
  document.getElementById('eCat').value = d.acct;
  document.getElementById('eDesc').value = d.summary;
  document.getElementById('eVendor').value = d.target;
  document.getElementById('eAmt').value = d.expense || d.income;
  document.getElementById('eType').value = d.expense ? 'expense' : 'income';
}

function closeEdit() {
  document.getElementById('editModal').style.display = 'none';
}

async function saveEdit() {
  var idx = document.getElementById('eId').value;
  var isExpense = document.getElementById('eType').value === 'expense';
  var amt = parseFloat(document.getElementById('eAmt').value) || 0;
  var entry = {
    date: document.getElementById('eDate').value,
    acct: document.getElementById('eCat').value || '其他',
    icon: '📌',
    cat: document.getElementById('eCat').value || '其他',
    summary: document.getElementById('eDesc').value,
    target: document.getElementById('eVendor').value,
    expense: isExpense ? amt : 0,
    income: isExpense ? 0 : amt,
    balance: 0,
    remark: '',
    source: 'manual'
  };

  if (idx !== '') {
    allData[parseInt(idx)] = entry;
  } else {
    allData.push(entry);
  }

  // 存到伺服器
  try {
    await fetch('/api/expenses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: entry.date, category: entry.acct, vendor: entry.target,
        description: entry.summary, amount: entry.expense || entry.income,
        tax: 0, invoiceNo: '', paymentMethod: isExpense ? '支出' : '存入',
        payDate: entry.date
      })
    });
  } catch(e) {}

  closeEdit();
  buildFilters();
  render();
}

function delEntry(idx) {
  if (!confirm('確定刪除？')) return;
  allData.splice(idx, 1);
  buildFilters();
  render();
}

// Initial render
render();
</script>
</body>
</html>
