<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報價單辨識系統 - 付委托名錄</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 1200px; margin: 0 auto; padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
    .upload-zone {
      border: 3px dashed #ccc;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-zone:hover { border-color: #4CAF50; background: #f9f9f9; }
    .upload-zone.dragover { border-color: #4CAF50; background: #e8f5e9; }
    #fileInput { display: none; }
    .btn {
      background: #4CAF50; color: white; border: none;
      padding: 12px 24px; border-radius: 5px; cursor: pointer;
      font-size: 16px; margin: 10px 5px;
    }
    .btn:hover { background: #45a049; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #2196F3; }
    .btn-secondary:hover { background: #1976D2; }
    .btn-danger { background: #f44336; }
    .btn-danger:hover { background: #d32f2f; }
    
    .result-section {
      background: white; border-radius: 10px; padding: 20px; margin-top: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .project-select {
      width: 100%; padding: 10px; font-size: 16px; margin-bottom: 15px;
      border: 1px solid #ddd; border-radius: 5px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #4CAF50; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .amount { text-align: right; font-family: monospace; }
    .total-row { font-weight: bold; background: #e8f5e9 !important; }
    .status-paid { color: #4CAF50; font-weight: bold; }
    .status-unpaid { color: #f44336; font-weight: bold; }
    
    .loading {
      display: none; text-align: center; padding: 40px;
    }
    .spinner {
      border: 4px solid #f3f3f3; border-top: 4px solid #4CAF50;
      border-radius: 50%; width: 40px; height: 40px;
      animation: spin 1s linear infinite; margin: 0 auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 15px; }
    .tab {
      padding: 10px 20px; cursor: pointer; border: none; background: none;
      font-size: 16px; color: #666;
    }
    .tab.active { color: #4CAF50; border-bottom: 2px solid #4CAF50; margin-bottom: -2px; }
    
    .alert {
      padding: 15px; border-radius: 5px; margin: 10px 0;
    }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    
    .vendor-item {
      display: flex; align-items: center; gap: 10px; padding: 8px;
      border-bottom: 1px solid #eee;
    }
    .vendor-item:last-child { border-bottom: none; }
    .vendor-checkbox { width: 20px; height: 20px; }
    .vendor-category { 
      background: #e3f2fd; padding: 3px 8px; border-radius: 3px; 
      font-size: 12px; color: #1565c0;
    }
    .vendor-name { flex: 1; font-weight: 500; }
    .vendor-amount { font-family: monospace; font-weight: bold; }
    
    .back-link {
      display: inline-block; margin-bottom: 20px; color: #4CAF50;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← 返回總覽</a>
  <h1>📄 報價單辨識系統</h1>
  
  <div class="upload-zone" id="uploadZone">
    <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
    <p style="font-size: 18px;">點擊或拖曳報價單檔案到此處</p>
    <p style="color: #666;">支援 Excel (.xls, .xlsx) 及 PDF 檔案</p>
    <input type="file" id="fileInput" accept=".xls,.xlsx,.pdf">
  </div>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在解析報價單...</p>
  </div>
  
  <div id="resultSection" style="display: none;">
    <div class="result-section">
      <h2>📋 解析結果</h2>
      <div id="alertBox"></div>
      
      <label><strong>選擇專案：</strong></label>
      <select id="projectSelect" class="project-select">
        <option value="">-- 請選擇專案 --</option>
      </select>
      
      <div class="tabs">
        <button class="tab active" data-tab="unpaid">未付款項目</button>
        <button class="tab" data-tab="paid">已付款項目</button>
        <button class="tab" data-tab="all">全部項目</button>
      </div>
      
      <div id="vendorList"></div>
      
      <div style="margin-top: 20px; text-align: right;">
        <span style="margin-right: 20px;">
          <strong>合計：</strong>
          <span id="totalAmount" style="font-size: 24px; color: #4CAF50;">$0</span>
        </span>
      </div>
      
      <div style="margin-top: 20px; text-align: center;">
        <button class="btn" id="saveBtn" onclick="saveVendors()">💾 儲存至專案</button>
        <button class="btn btn-secondary" onclick="resetForm()">🔄 重新上傳</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let parsedVendors = [];
    let currentProjectId = null;
    let projectVendors = [];
    
    // 類別分類函數
    function categorizeItem(itemName) {
      if (!itemName) return '其他';
      const name = String(itemName).toLowerCase();
      
      if (name.includes('結構') || name.includes('鋼筋') || name.includes('技師')) return '結構/鑽探';
      if (name.includes('水電') || name.includes('電氣') || name.includes('弱電') || name.includes('給排水') || name.includes('消防') || name.includes('空調')) return '水電/消防';
      if (name.includes('跑照') || name.includes('建照') || name.includes('執照')) return '跑照/3D';
      if (name.includes('測量') || name.includes('建築線') || name.includes('土地') || name.includes('建物') || name.includes('鑑界')) return '測量/建築線';
      if (name.includes('綠建築') || name.includes('節能')) return '綠建築/估算';
      if (name.includes('水保') || name.includes('大地') || name.includes('地質')) return '水保/大地';
      if (name.includes('監造')) return '監造';
      if (name.includes('室內') || name.includes('裝修')) return '室內裝修';
      if (name.includes('污水') || name.includes('排水') || name.includes('開工')) return '污水/排水';
      if (name.includes('預算') || name.includes('估算')) return '估算';
      
      return '其他';
    }
    
    // 提取廠商名稱
    function extractVendorName(itemName, remark) {
      const text = String(itemName) + ' ' + String(remark);
      const knownVendors = [
        '黃明煌', '鋐誠', '國安', '創源', '賴淑芬', '九江',
        '佰城', '天翔', '王偉傑', '王瑋傑', '鄒宗顯', '長新',
        '朋泰', '邱寶止', '張宏暐', '陳雨軒', '睿宇', '中酉',
        '韋鉅', '剛健', '詠翊', '智森', '欣凱'
      ];
      
      for (const vendor of knownVendors) {
        if (text.includes(vendor)) return vendor;
      }
      return String(itemName).replace(/\n/g, ' ').substring(0, 30);
    }
    
    // 用 XLSX 解析 Excel
    function parseExcelFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            
            let projectName = '';
            let client = '';
            let date = '';
            const vendors = [];
            
            // 找專案名稱
            for (let row of jsonData) {
              if (!row) continue;
              const rowStr = String(row);
              if (rowStr.includes('案名:') || rowStr.includes('案件名稱')) {
                const match = rowStr.match(/案名[:：]\s*(.+)/);
                if (match) projectName = match[1].trim();
              }
              if (rowStr.match(/\d{2}\/\d{2}\/\d{2,4}/)) {
                const match = rowStr.match(/(\d{2,4}\/\d{2}\/\d{2})/);
                if (match) date = match[1];
              }
            }
            
            // 解析副委託費用
            let inSubSection = false;
            for (let i = 0; i < jsonData.length; i++) {
              const row = jsonData[i];
              if (!row) continue;
              const rowStr = String(row);
              
              if (rowStr.includes('B.副委託費用') || rowStr.includes('副委託')) {
                inSubSection = true;
                continue;
              }
              
              if (inSubSection && (rowStr.includes('A(設計費)') || rowStr.includes('其它費用') || rowStr.includes('C.'))) {
                break;
              }
              
              if (!inSubSection) continue;
              
              const itemNo = row[0];
              const itemName = row[1];
              const totalPrice = parseFloat(row[5]) || 0;
              
              if (!itemNo || itemNo === '項次' || isNaN(parseInt(String(itemNo)))) continue;
              if (totalPrice <= 0) continue;
              
              const category = categorizeItem(itemName);
              const vendorName = extractVendorName(itemName, row[6] || '');
              
              vendors.push({
                category: category,
                name: vendorName,
                amount: totalPrice,
                remark: row[6] || ''
              });
            }
            
            resolve({
              success: true,
              projectName: projectName || file.name.replace(/\.(xls|xlsx)$/i, ''),
              client,
              date,
              vendors
            });
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }
    
    // 載入專案列表
    async function loadProjects() {
      try {
        const res = await fetch(API_BASE + '/api/data/archAccounting');
        const data = await res.json();
        const select = document.getElementById('projectSelect');
        
        const projects = data.projects || [];
        projects.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `[${p.year || ''}] ${p.projectName || '未命名'} - ${p.client || '未知客戶'}`;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error('載入專案失敗:', e);
      }
    }
    
    // 檔案上傳處理
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });
    
    async function handleFile(file) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('resultSection').style.display = 'none';
      
      try {
        let result;
        if (file.name.match(/\.xls[x]?$/i)) {
          result = await parseExcelFile(file);
        } else {
          throw new Error('目前只支援 Excel 檔案，PDF 功能開發中');
        }
        
        if (result.success) {
          parsedVendors = result.vendors || [];
          document.getElementById('loading').style.display = 'none';
          document.getElementById('resultSection').style.display = 'block';
          
          autoSelectProject(result.projectName, result.client);
          renderVendorList();
        } else {
          throw new Error(result.error || '解析失敗');
        }
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showAlert(e.message, 'error');
      }
    }
    
    function autoSelectProject(projectName, client) {
      const select = document.getElementById('projectSelect');
      const searchText = (projectName + ' ' + client).toLowerCase();
      
      let bestMatch = null;
      let bestScore = 0;
      
      for (let i = 0; i < select.options.length; i++) {
        const opt = select.options[i];
        const optText = opt.textContent.toLowerCase();
        let score = 0;
        
        if (searchText.includes('高鐵工業') && optText.includes('高鐵工業')) score += 10;
        if (searchText.includes('513') && optText.includes('513')) score += 5;
        if (searchText.includes('工廠') && optText.includes('工廠')) score += 3;
        
        if (score > bestScore) {
          bestScore = score;
          bestMatch = opt.value;
        }
      }
      
      if (bestMatch) select.value = bestMatch;
    }
    
    async function loadProjectVendors(projectId) {
      try {
        const res = await fetch(API_BASE + '/api/data/archAccounting');
        const data = await res.json();
        const project = (data.projects || []).find(p => p.id == projectId);
        return project && project.vendors ? project.vendors : [];
      } catch (e) {
        console.error('載入專案廠商失敗:', e);
        return [];
      }
    }
    
    async function renderVendorList(filter = 'unpaid') {
      const container = document.getElementById('vendorList');
      const select = document.getElementById('projectSelect');
      currentProjectId = select.value;
      
      if (!currentProjectId) {
        container.innerHTML = '<p style="text-align: center; color: #666;">請先選擇專案</p>';
        document.getElementById('totalAmount').textContent = '$0';
        return;
      }
      
      projectVendors = await loadProjectVendors(currentProjectId);
      const existingAmounts = projectVendors.map(v => v.amount);
      
      let filtered = parsedVendors;
      if (filter === 'unpaid') {
        filtered = parsedVendors.filter(v => !existingAmounts.includes(v.amount));
      } else if (filter === 'paid') {
        filtered = parsedVendors.filter(v => existingAmounts.includes(v.amount));
      }
      
      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666;">無相符項目</p>';
        document.getElementById('totalAmount').textContent = '$0';
        return;
      }
      
      let html = '<table><thead><tr><th>勾選</th><th>類別</th><th>廠商/項目</th><th>金額</th><th>狀態</th></tr></thead><tbody>';
      let total = 0;
      
      filtered.forEach((v, idx) => {
        const isPaid = existingAmounts.includes(v.amount);
        total += v.amount;
        
        html += `<tr>
          <td><input type="checkbox" class="vendor-checkbox" data-idx="${idx}" ${isPaid ? 'checked disabled' : ''}></td>
          <td><span class="vendor-category">${v.category || '-'}</span></td>
          <td>${v.name}</td>
          <td class="amount">$${v.amount.toLocaleString()}</td>
          <td class="${isPaid ? 'status-paid' : 'status-unpaid'}">${isPaid ? '已付款' : '未付款'}</td>
        </tr>`;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
      document.getElementById('totalAmount').textContent = '$' + total.toLocaleString();
    }
    
    // Tab 切換
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderVendorList(tab.dataset.tab);
      });
    });
    
    // 專案選擇變更
    document.getElementById('projectSelect').addEventListener('change', () => {
      const activeTab = document.querySelector('.tab.active').dataset.tab;
      renderVendorList(activeTab);
    });
    
    async function saveVendors() {
      const projectId = document.getElementById('projectSelect').value;
      if (!projectId) {
        showAlert('請先選擇專案', 'error');
        return;
      }
      
      const checkboxes = document.querySelectorAll('.vendor-checkbox:checked:not(:disabled)');
      const selectedIndices = Array.from(checkboxes).map(cb => parseInt(cb.dataset.idx));
      const selectedVendors = selectedIndices.map(i => parsedVendors[i]);
      
      if (selectedVendors.length === 0) {
        showAlert('請至少選擇一個項目', 'error');
        return;
      }
      
      try {
        const res = await fetch(API_BASE + '/api/add-vendors', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            projectId: parseInt(projectId),
            vendors: selectedVendors
          })
        });
        const data = await res.json();
        
        if (data.success) {
          showAlert('✅ 儲存成功！已更新 ' + data.addedCount + ' 個項目', 'success');
          setTimeout(() => {
            renderVendorList(document.querySelector('.tab.active').dataset.tab);
          }, 1000);
        } else {
          throw new Error(data.error);
        }
      } catch (e) {
        showAlert('儲存失敗: ' + e.message, 'error');
      }
    }
    
    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }
    
    function resetForm() {
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('fileInput').value = '';
      document.getElementById('alertBox').innerHTML = '';
      parsedVendors = [];
      currentProjectId = null;
      projectVendors = [];
    }
    
    // 初始化
    loadProjects();
  </script>
</body>
</html>
