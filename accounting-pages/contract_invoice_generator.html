<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合約自動請款單與收據生成器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;600;700;900&display=swap');

  :root {
    --ink: #1a1a1a;
    --accent: #2c3e50;
    --accent2: #8b0000;
    --bg: #eae6e0;
    --card: #fff;
    --muted: #777;
    --border: #ccc;
    --success: #27ae60;
    --warn: #e67e22;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Top Bar ── */
  .topbar {
    background: var(--accent);
    color: #fff;
    padding: 12px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky; top: 0; z-index: 200;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .topbar .step-dots { display: flex; gap: 6px; margin-left: auto; }
  .topbar .dot {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,.15); color: rgba(255,255,255,.5);
    transition: .3s;
  }
  .topbar .dot.active { background: #fff; color: var(--accent); }
  .topbar .dot.done { background: var(--success); color: #fff; }

  /* ── Views ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ═══ STEP 1: Upload ═══ */
  .upload-view {
    max-width: 700px;
    margin: 60px auto;
    text-align: center;
  }
  .upload-zone {
    border: 3px dashed var(--border);
    border-radius: 16px;
    padding: 60px 40px;
    background: var(--card);
    cursor: pointer;
    transition: .3s;
    margin-bottom: 24px;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: #f0ede8;
  }
  .upload-zone .icon { font-size: 48px; margin-bottom: 12px; }
  .upload-zone h2 { font-size: 20px; color: var(--accent); margin-bottom: 8px; }
  .upload-zone p { color: var(--muted); font-size: 14px; }
  .upload-zone input { display: none; }
  .file-info {
    background: var(--card);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .file-info .fi-icon { font-size: 36px; }
  .file-info .fi-name { font-weight: 700; font-size: 15px; }
  .file-info .fi-size { color: var(--muted); font-size: 13px; }
  .file-info .fi-status { margin-left: auto; font-size: 13px; }
  .file-info .fi-status.ok { color: var(--success); font-weight: 700; }
  .file-info .fi-status.err { color: var(--accent2); }

  .btn {
    display: inline-block; padding: 12px 32px;
    border: none; border-radius: 6px;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: .2s;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1a2a3a; }
  .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
  .btn-danger { background: var(--accent2); color: #fff; }
  .btn-danger:hover { opacity: .85; }
  .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
  .btn-outline:hover { background: var(--accent); color: #fff; }
  .btn-sm { padding: 6px 16px; font-size: 13px; }

  .mt16 { margin-top: 16px; }
  .mt24 { margin-top: 24px; }

  /* ═══ STEP 2: Confirm Data ═══ */
  .confirm-view {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 20px;
  }
  .data-card {
    background: var(--card);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .data-card h3 {
    font-size: 15px;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .data-card h3 .badge {
    font-size: 11px;
    background: var(--accent);
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
  .fg { display: flex; flex-direction: column; }
  .fg label { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .fg input, .fg select, .fg textarea {
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    background: #fafafa;
  }
  .fg input:focus, .fg textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .fg.full { grid-column: 1 / -1; }

  .period-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  .period-table th {
    background: var(--accent);
    color: #fff;
    padding: 8px 10px;
    text-align: left;
    font-weight: 500;
  }
  .period-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
  }
  .period-table tr:hover { background: #f5f3f0; }
  .period-table input[type="date"] {
    padding: 4px 6px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 13px;
    font-family: inherit;
  }

  .actions-bar {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  /* ═══ STEP 3: Generated Documents ═══ */
  .output-view {
    padding: 20px;
  }
  .output-toolbar {
    max-width: 1100px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .output-toolbar h2 { font-size: 18px; color: var(--accent); margin-right: auto; }
  .doc-tabs {
    display: flex;
    gap: 4px;
    max-width: 1100px;
    margin: 0 auto 16px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .doc-tab {
    padding: 8px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    white-space: nowrap;
    transition: .2s;
  }
  .doc-tab:hover { background: #f0ede8; }
  .doc-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .doc-container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ── Document Page (print-ready) ── */
  .doc-page {
    width: 210mm;
    min-height: 270mm;
    margin: 0 auto 30px;
    background: #fff;
    padding: 14mm 18mm;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
    font-family: '標楷體', 'DFKai-SB', 'Noto Serif TC', 'BiauKai', serif;
    font-size: 14px;
    line-height: 1.6;
    color: #000;
  }

  /* ── Invoice Styles ── */
  .inv-title { text-align: center; font-size: 22px; font-weight: 900; letter-spacing: 6px; margin-bottom: 4px; }
  .inv-date { text-align: right; font-size: 13px; margin-bottom: 8px; }
  .inv-table { width: 100%; border-collapse: collapse; border: 2px solid #000; }
  .inv-table th, .inv-table td { border: 1px solid #000; padding: 4px 8px; vertical-align: middle; font-size: 14px; }
  .inv-table .lbl { background: #f0f0f0; text-align: center; font-weight: 700; white-space: nowrap; letter-spacing: 2px; }
  .inv-table .val { text-align: left; }

  .inv-section { border: 2px solid #000; border-top: none; padding: 10px 12px; font-size: 14px; line-height: 1.8; }
  .inv-section .sec-title { font-weight: 700; margin-bottom: 4px; }
  .inv-section .row { display: flex; margin-bottom: 1px; }
  .inv-section .row-label { width: 110px; flex-shrink: 0; }
  .inv-section .row-label-w { width: 140px; flex-shrink: 0; }

  .inv-chinese-amt { text-align: center; font-size: 18px; font-weight: 700; padding: 8px; border: 2px solid #000; border-top: none; letter-spacing: 3px; }

  /* ── Receipt Styles ── */
  .rct-title { text-align: center; font-size: 28px; font-weight: 900; letter-spacing: 16px; margin-bottom: 6px; }
  .rct-date { text-align: right; font-size: 14px; margin-bottom: 14px; }
  .rct-issuer { margin-bottom: 14px; line-height: 1.9; font-size: 14px; }
  .rct-issuer .issuer-name { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .rct-issuer .irow { display: flex; }
  .rct-issuer .irow-label { width: 100px; flex-shrink: 0; }
  .rct-to { margin-bottom: 6px; font-size: 14px; line-height: 1.8; }
  .rct-table { width: 100%; border-collapse: collapse; border: 2px solid #000; }
  .rct-table th { border: 1px solid #000; padding: 6px 10px; background: #f0f0f0; font-weight: 700; font-size: 14px; }
  .rct-table td { border: 1px solid #000; padding: 6px 10px; font-size: 14px; }
  .rct-table .col-no { width: 70px; text-align: center; }
  .rct-table .col-desc { text-align: left; }
  .rct-table .col-amt { width: 140px; text-align: right; }
  .rct-total td { font-weight: 700; border-top: 2px solid #000; }
  .rct-confirm { margin-top: 18px; font-size: 14px; line-height: 2; }
  .rct-confirm b { text-decoration: underline; }
  .rct-sign { margin-top: 36px; text-align: right; font-size: 14px; }
  .rct-note { margin-top: 24px; font-size: 13px; color: #333; }
  .stamp { display: inline-block; width: 56px; height: 56px; border: 1px dashed #999; border-radius: 50%; text-align: center; line-height: 56px; color: #aaa; font-size: 11px; margin-left: 8px; vertical-align: middle; }

  /* ── Print ── */
  @media print {
    body { background: #fff; }
    .topbar, .upload-view, .confirm-view, .output-toolbar, .doc-tabs, .no-print { display: none !important; }
    .output-view { padding: 0; }
    .doc-container { max-width: none; }
    .doc-page { box-shadow: none; margin: 0; page-break-after: always; page-break-inside: avoid; }
    .doc-page:last-child { page-break-after: auto; }
  }

  @media (max-width: 800px) {
    .field-grid { grid-template-columns: 1fr; }
    .field-grid.cols3 { grid-template-columns: 1fr; }
    .doc-page { width: 100%; padding: 10mm; }
  }

  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
  }
  .loading-box {
    background: #fff;
    padding: 40px 50px;
    border-radius: 12px;
    text-align: center;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #ddd;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <h1>📋 合約自動請款單 / 收據生成器</h1>
  <div class="step-dots">
    <div class="dot active" id="dot1">1</div>
    <div class="dot" id="dot2">2</div>
    <div class="dot" id="dot3">3</div>
  </div>
</div>

<!-- Loading -->
<div class="loading-overlay hidden" id="loading">
  <div class="loading-box">
    <div class="spinner"></div>
    <div>正在解析合約內容...</div>
  </div>
</div>

<!-- ═══════════════ STEP 1: Upload ═══════════════ -->
<div class="view active" id="step1">
  <div class="upload-view">
    <div class="upload-zone" id="dropZone">
      <div class="icon">📄</div>
      <h2>上傳合約檔案</h2>
      <p>支援 .docx 及 .doc 格式<br>拖拽檔案至此處或點擊選擇</p>
      <input type="file" id="fileInput" accept=".docx,.doc">
    </div>
    <div id="fileInfoArea"></div>
    <button class="btn btn-primary mt24 hidden" id="btnParse" onclick="parseContract()">開始解析合約</button>
  </div>
</div>

<!-- ═══════════════ STEP 2: Confirm ═══════════════ -->
<div class="view" id="step2">
  <div class="confirm-view">
    <div class="data-card">
      <h3>🏢 業主資訊 <span class="badge">甲方</span></h3>
      <div class="field-grid">
        <div class="fg"><label>公司/姓名</label><input id="c_owner"></div>
        <div class="fg"><label>負責人</label><input id="c_owner_rep"></div>
        <div class="fg full"><label>地址</label><input id="c_owner_addr"></div>
        <div class="fg"><label>統一編號</label><input id="c_owner_taxid"></div>
        <div class="fg"><label>電話</label><input id="c_owner_phone"></div>
      </div>
    </div>

    <div class="data-card">
      <h3>🏛️ 建築師/事務所資訊 <span class="badge">乙方</span></h3>
      <div class="field-grid">
        <div class="fg"><label>事務所名稱</label><input id="c_arch" value="張哲維建築師事務所"></div>
        <div class="fg"><label>負責人/建築師</label><input id="c_arch_rep" value="張哲維"></div>
        <div class="fg full"><label>所址</label><input id="c_arch_addr" value="408台中市南屯區大墩一街241-1號2樓"></div>
        <div class="fg"><label>公司地址</label><input id="c_arch_company_addr"></div>
        <div class="fg"><label>統一編號</label><input id="c_arch_taxid" value="47580887"></div>
        <div class="fg"><label>電話</label><input id="c_arch_phone" value="04-24739736"></div>
        <div class="fg"><label>傳真</label><input id="c_arch_fax" value="04-24739305"></div>
      </div>
    </div>

    <div class="data-card">
      <h3>🏗️ 工程資訊</h3>
      <div class="field-grid">
        <div class="fg full"><label>工程名稱（案名）</label><input id="c_project"></div>
        <div class="fg full"><label>地段地號</label><input id="c_site"></div>
        <div class="fg"><label>建築構造</label><input id="c_structure"></div>
        <div class="fg"><label>樓層</label><input id="c_floors"></div>
        <div class="fg"><label>合約總金額 (含稅)</label><input id="c_total" type="number"></div>
        <div class="fg"><label>扣繳稅率 (%)</label><input id="c_tax_rate" value="10" type="number"></div>
      </div>
    </div>

    <div class="data-card">
      <h3>💰 各期請款明細 <span class="badge" id="periodCount">0 期</span></h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">請款日期與收據日期可手動調整；其餘資料由合約自動帶入。</p>
      <div style="overflow-x:auto;">
        <table class="period-table" id="periodTable">
          <thead>
            <tr>
              <th style="width:60px;">期數</th>
              <th>摘要說明</th>
              <th style="width:80px;">比例(%)</th>
              <th style="width:130px;">金額(含稅)</th>
              <th style="width:145px;">請款日期</th>
              <th style="width:145px;">收據日期</th>
              <th style="width:50px;"></th>
            </tr>
          </thead>
          <tbody id="periodBody"></tbody>
        </table>
      </div>
      <button class="btn btn-outline btn-sm mt16" onclick="addPeriodRow()">＋ 手動新增期數</button>
    </div>

    <div class="data-card">
      <h3>🏦 匯款資訊</h3>
      <div class="field-grid">
        <div class="fg"><label>匯款戶名</label><input id="c_bank_name"></div>
        <div class="fg"><label>銀行代號</label><input id="c_bank_code"></div>
        <div class="fg"><label>匯款銀行</label><input id="c_bank"></div>
        <div class="fg"><label>匯款帳號</label><input id="c_bank_acct"></div>
      </div>
    </div>

    <div class="actions-bar">
      <button class="btn btn-outline" onclick="goStep(1)">← 重新上傳</button>
      <button class="btn btn-primary" onclick="generateAll()">生成全部請款單與收據 →</button>
    </div>
  </div>
</div>

<!-- ═══════════════ STEP 3: Output ═══════════════ -->
<div class="view" id="step3">
  <div class="output-view">
    <div class="output-toolbar no-print">
      <h2>📄 已生成文件</h2>
      <button class="btn btn-outline btn-sm" onclick="goStep(2)">← 返回修改</button>
      <button class="btn btn-primary btn-sm" onclick="printCurrent()">列印當前文件</button>
      <button class="btn btn-danger btn-sm" onclick="printAll()">列印全部文件</button>
    </div>
    <div class="doc-tabs no-print" id="docTabs"></div>
    <div class="doc-container" id="docContainer"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let contractData = {};
let uploadedFile = null;
let allDocs = [];
let currentDocIdx = 0;

// ══════════════════════════════════════════
//  STEP NAVIGATION
// ══════════════════════════════════════════
function goStep(n) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.remove('active', 'done');
    if (i + 1 < n) d.classList.add('done');
    if (i + 1 === n) d.classList.add('active');
  });
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════
//  FILE UPLOAD
// ══════════════════════════════════════════
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['doc', 'docx'].includes(ext)) {
    alert('請上傳 .doc 或 .docx 檔案');
    return;
  }
  uploadedFile = file;
  const sizeKB = (file.size / 1024).toFixed(1);
  document.getElementById('fileInfoArea').innerHTML = `
    <div class="file-info">
      <div class="fi-icon">📎</div>
      <div>
        <div class="fi-name">${file.name}</div>
        <div class="fi-size">${sizeKB} KB · ${ext.toUpperCase()} 格式</div>
      </div>
      <div class="fi-status ok">✓ 已選取</div>
    </div>`;
  document.getElementById('btnParse').classList.remove('hidden');
}

// ══════════════════════════════════════════
//  CONTRACT PARSING
// ══════════════════════════════════════════
async function parseContract() {
  if (!uploadedFile) return;
  document.getElementById('loading').classList.remove('hidden');

  try {
    const arrayBuffer = await uploadedFile.arrayBuffer();
    let text = '';

    const ext = uploadedFile.name.split('.').pop().toLowerCase();
    if (ext === 'docx') {
      const result = await mammoth.extractRawText({ arrayBuffer });
      text = result.value;
    } else {
      // .doc — try UTF-16LE then Big5
      const bytes = new Uint8Array(arrayBuffer);
      const decoder16 = new TextDecoder('utf-16le', { fatal: false });
      text = decoder16.decode(bytes);
      // If we don't find Chinese chars, fallback
      if (!/[\u4e00-\u9fff]{5,}/.test(text)) {
        const decoderBig5 = new TextDecoder('big5', { fatal: false });
        text = decoderBig5.decode(bytes);
      }
    }

    extractContractData(text);
    populateForm();
    document.getElementById('loading').classList.add('hidden');
    goStep(2);
  } catch (err) {
    document.getElementById('loading').classList.add('hidden');
    alert('解析失敗：' + err.message);
    console.error(err);
  }
}

function extractContractData(text) {
  const d = {};
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const full = text;

  // === Project Name ===
  const caseMatch = full.match(/案\s*名[：:]\s*(.+?)(?:\r|\n)/);
  d.project = caseMatch ? caseMatch[1].trim() : '';

  // === Site ===
  const siteMatch = full.match(/地段[、，]?\s*地號[：:]\s*(.+?)(?:\r|\n)/);
  d.site = siteMatch ? siteMatch[1].trim() : '';

  // === Owner (甲方) ===
  const ownerMatch = full.match(/委託人\s+(.+?)\s+(?:負責人|[\(（]以下)/);
  d.owner = ownerMatch ? ownerMatch[1].replace(/\s+/g, '') : '';

  const ownerRepMatch = full.match(/負責人[:：]?\s*([^\s(（]+)/);
  d.ownerRep = ownerRepMatch ? ownerRepMatch[1].trim() : '';

  // Owner address from 立合約書人 section
  const ownerAddrMatch = full.match(/甲方[：:].+?地址[：:]\s*(.+?)(?:\r|\n)/s);
  d.ownerAddr = ownerAddrMatch ? ownerAddrMatch[1].trim() : '';

  // Owner tax ID — limit search to within the 甲方 block (stop at 乙方 boundary)
  const ownerTaxMatch = full.match(/甲方[：:](?:(?!乙方).)*?統一編號[：:]\s*(\d+)/s);
  d.ownerTaxId = ownerTaxMatch ? ownerTaxMatch[1] : '';

  // Owner phone
  const ownerPhoneMatch = full.match(/甲方[：:].+?電話[：:]\s*([\d\-]+)/s);
  d.ownerPhone = ownerPhoneMatch ? ownerPhoneMatch[1] : '';

  // === Architect (乙方) ===
  d.architect = '張哲維建築師事務所'; // default
  const archMatch = full.match(/([\u4e00-\u9fff]+建築師事務所)/);
  if (archMatch) d.architect = archMatch[1];

  const archRepMatch = full.match(/建築師\s*[：:]?\s*([^\s]+)\s/);
  d.archRep = '';
  // Find architect name from "建築師　張哲維"
  const archNameMatch = full.match(/建築師[　\s]+([^\s（(]+)/);
  if (archNameMatch) d.archRep = archNameMatch[1].replace(/一致同意/, '').trim();

  // Architect addresses
  const archAddrMatch = full.match(/(?:聯絡)?所址[：:]\s*(.+?)(?:\r|\n)/);
  d.archAddr = archAddrMatch ? archAddrMatch[1].trim() : '408台中市南屯區大墩一街241-1號2樓';

  const companyAddrMatch = full.match(/公司地址[：:]\s*(.+?)(?:\r|\n)/);
  d.archCompanyAddr = companyAddrMatch ? companyAddrMatch[1].trim() : '';

  // Architect tax ID — limit search to within the 乙方 block (stop at 甲方 boundary
  // so we never accidentally grab the owner's tax ID, even when 乙方 appears first
  // in the document).
  const archTaxMatch = full.match(/乙方(?:(?!甲方).)*?統一編號[：:]\s*(\d+)/s);
  d.archTaxId = archTaxMatch ? archTaxMatch[1] : '47580887';

  const archPhoneMatch = full.match(/公司電話[：:]\s*([\d\-]+)/);
  d.archPhone = archPhoneMatch ? archPhoneMatch[1] : '04-24739736';

  const archFaxMatch = full.match(/公司傳真[：:]\s*([\d\-]+)/);
  d.archFax = archFaxMatch ? archFaxMatch[1] : '04-24739305';

  // === Structure ===
  const structMatch = full.match(/建造下列建築物[：:]\s*(.+?)(?:\r|\n)/);
  d.structure = structMatch ? structMatch[1].trim() : '';

  // Floors
  const floorMatch = full.match(/地上([^\s]+層)/);
  d.floorsUp = floorMatch ? floorMatch[1] : '';
  const floorDownMatch = full.match(/地下([^\s]+層)/);
  d.floorsDown = floorDownMatch ? floorDownMatch[1] : '';
  d.floors = (d.floorsUp ? '地上：' + d.floorsUp : '') + (d.floorsDown ? '  地下：' + d.floorsDown : '');

  // === Total Amount ===
  const totalMatch = full.match(/新台幣\s*([\d,]+)\s*元整/);
  d.total = totalMatch ? parseInt(totalMatch[1].replace(/,/g, '')) : 0;

  // === Payment Periods ===
  d.periods = [];
  // Pattern: 第X期 ... 給付總(酬金|價金)XX% ... (金額)
  const periodRegex = /第([一二三四五六七八九十\d]+)期[：:、]?\s*(.+?)(?:給付總(?:酬金|價金)\s*(\d+)\s*%|$)/g;
  let match;
  const numMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };

  // More robust: find lines with period info
  const periodLines = full.match(/[（(]?[一二三四五六七八九十]?\s*[)）]?\s*[、，]?\s*第[一二三四五六七八九十\d]+期.+/g) || [];

  const seenPeriods = new Set();
  for (const line of periodLines) {
    const pMatch = line.match(/第([一二三四五六七八九十\d]+)期/);
    if (!pMatch) continue;
    const pNum = numMap[pMatch[1]] || parseInt(pMatch[1]) || 0;
    if (pNum === 0 || seenPeriods.has(pNum)) continue;
    seenPeriods.add(pNum);

    // Extract percentage
    const pctMatch = line.match(/(?:給付總(?:酬金|價金)\s*)?(\d+)\s*%/);
    const pct = pctMatch ? parseInt(pctMatch[1]) : 0;

    // Extract description
    let desc = line.replace(/[（(][一二三四五六七八九十]?\s*[)）]\s*[、，]?\s*/, '').trim();
    // Clean up the description
    desc = desc.replace(/第[一二三四五六七八九十\d]+期[：:、]?\s*/, '');
    desc = desc.replace(/，?給付總[酬價]金\s*\d+\s*%.*/g, '').trim();
    if (desc.length > 60) desc = desc.substring(0, 60) + '…';

    // Extract amount from parentheses (金額元)
    const amtMatch = line.match(/([\d,]+)\s*元/);
    let amt = 0;
    if (amtMatch) {
      amt = parseInt(amtMatch[1].replace(/,/g, ''));
    } else if (d.total && pct) {
      amt = Math.round(d.total * pct / 100);
    }

    d.periods.push({
      num: pNum,
      desc: desc || `建築師第${pMatch[1]}期服務酬金`,
      pct: pct,
      amount: amt,
      invoiceDate: '',
      receiptDate: ''
    });
  }

  // Sort by period number
  d.periods.sort((a, b) => a.num - b.num);

  // If no amounts found, recalculate from total
  if (d.total) {
    d.periods.forEach(p => {
      if (!p.amount && p.pct) {
        p.amount = Math.round(d.total * p.pct / 100);
      }
    });
  }

  contractData = d;
}

function addPeriodRow(p) {
  const tbody = document.getElementById('periodBody');
  const idx = tbody.children.length + 1;
  const tr = document.createElement('tr');
  const numLabels = ['','一','二','三','四','五','六','七','八','九','十'];
  const num = p ? p.num : idx;
  tr.innerHTML = `
    <td style="text-align:center;font-weight:700;">${numLabels[num] || num}</td>
    <td><input value="${p ? p.desc : ''}" class="pd-desc" style="width:100%;padding:4px 6px;border:1px solid #ddd;border-radius:3px;font-size:13px;"></td>
    <td><input type="number" value="${p ? p.pct : ''}" class="pd-pct" style="width:100%;padding:4px 6px;border:1px solid #ddd;border-radius:3px;font-size:13px;text-align:center;" onchange="recalcAmt(this)"></td>
    <td style="text-align:right;font-weight:600;" class="pd-amt-cell">NT$ ${p ? fmt(p.amount) : '0'}</td>
    <td><input type="date" class="pd-inv-date" value="${p && p.invoiceDate ? p.invoiceDate : ''}" style="width:100%;"></td>
    <td><input type="date" class="pd-rct-date" value="${p && p.receiptDate ? p.receiptDate : ''}" style="width:100%;"></td>
    <td><button class="btn-sm" style="background:none;border:none;color:#c00;cursor:pointer;font-size:16px;" onclick="this.closest('tr').remove();updatePeriodCount();">✕</button></td>
  `;
  tr.dataset.num = num;
  tr.dataset.amt = p ? p.amount : 0;
  tbody.appendChild(tr);
  updatePeriodCount();
}

function recalcAmt(input) {
  const tr = input.closest('tr');
  const pct = parseFloat(input.value) || 0;
  const total = parseFloat(document.getElementById('c_total').value) || 0;
  const amt = Math.round(total * pct / 100);
  tr.dataset.amt = amt;
  tr.querySelector('.pd-amt-cell').textContent = 'NT$ ' + fmt(amt);
}

function updatePeriodCount() {
  const count = document.getElementById('periodBody').children.length;
  document.getElementById('periodCount').textContent = count + ' 期';
}

function fmt(n) { return Number(n).toLocaleString(); }

// ══════════════════════════════════════════
//  NUMBER TO CHINESE
// ══════════════════════════════════════════
function numToChinese(n) {
  const digits = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖'];
  const units = ['','拾','佰','仟'];
  const bigUnits = ['','萬','億'];

  if (n === 0) return '零';
  let result = '';
  let groupIdx = 0;
  let lastGroupZero = false;

  while (n > 0) {
    const group = n % 10000;
    n = Math.floor(n / 10000);

    if (group === 0) {
      groupIdx++;
      lastGroupZero = true;
      continue;
    }

    let groupStr = '';
    let g = group;
    let needZero = false;

    for (let i = 0; i < 4; i++) {
      const d = g % 10;
      g = Math.floor(g / 10);
      if (d === 0) {
        if (i > 0 && groupStr) needZero = true;
      } else {
        if (needZero) { groupStr = digits[0] + groupStr; needZero = false; }
        groupStr = digits[d] + (i > 0 ? units[i] : '') + groupStr;
      }
    }

    if (lastGroupZero && result) groupStr += digits[0];
    result = groupStr + bigUnits[groupIdx] + result;
    lastGroupZero = false;
    groupIdx++;
  }

  return result;
}

function amountToChinese(amt) {
  return numToChinese(amt) + '元整';
}

// ══════════════════════════════════════════
//  GENERATE ALL DOCUMENTS
// ══════════════════════════════════════════
function generateAll() {
  const v = id => document.getElementById(id).value;
  allDocs = [];

  const rows = document.getElementById('periodBody').querySelectorAll('tr');
  const numLabels = ['','一','二','三','四','五','六','七','八','九','十'];
  const taxRate = parseFloat(v('c_tax_rate')) || 10;

  rows.forEach(tr => {
    const num = parseInt(tr.dataset.num) || 1;
    const desc = tr.querySelector('.pd-desc').value;
    const grossAmt = parseInt(tr.dataset.amt) || 0;
    const tax = Math.round(grossAmt * taxRate / 100);
    const net = grossAmt - tax;
    const invDate = tr.querySelector('.pd-inv-date').value;
    const rctDate = tr.querySelector('.pd-rct-date').value;
    const periodLabel = '第' + (numLabels[num] || num) + '期';
    const chineseAmt = amountToChinese(grossAmt);

    // Generate Invoice
    allDocs.push({
      type: 'invoice',
      label: `請款單 ${periodLabel}`,
      html: buildInvoiceHTML({
        period: periodLabel,
        date: invDate,
        owner: v('c_owner'),
        ownerRep: v('c_owner_rep'),
        ownerAddr: v('c_owner_addr'),
        project: v('c_project'),
        floors: v('c_floors'),
        site: v('c_site'),
        architect: v('c_arch'),
        archRep: v('c_arch_rep'),
        archAddr: v('c_arch_addr'),
        phone: v('c_arch_phone'),
        fax: v('c_arch_fax'),
        gross: grossAmt,
        tax, net, taxRate,
        chineseAmt,
        bankName: v('c_bank_name'),
        bankCode: v('c_bank_code'),
        bank: v('c_bank'),
        bankAcct: v('c_bank_acct'),
        desc
      })
    });

    // Generate Receipt
    allDocs.push({
      type: 'receipt',
      label: `收據 ${periodLabel}`,
      html: buildReceiptHTML({
        date: rctDate,
        issuer: v('c_arch'),
        issuerAddr: v('c_arch_addr'),
        companyAddr: v('c_arch_company_addr'),
        taxId: v('c_arch_taxid'),
        phone: v('c_arch_phone'),
        fax: v('c_arch_fax'),
        client: v('c_owner'),
        clientRep: v('c_owner_rep'),
        project: v('c_project'),
        period: periodLabel,
        desc: desc || `建築師${periodLabel}規劃服務酬金`,
        gross: grossAmt,
        tax, net, taxRate,
        chineseAmt,
        archRep: v('c_arch_rep')
      })
    });
  });

  renderDocuments();
  goStep(3);
}

// ══════════════════════════════════════════
//  RENDER DOCUMENTS
// ══════════════════════════════════════════
function renderDocuments() {
  const tabsEl = document.getElementById('docTabs');
  const containerEl = document.getElementById('docContainer');
  tabsEl.innerHTML = '';
  containerEl.innerHTML = '';

  allDocs.forEach((doc, idx) => {
    // Tab
    const tab = document.createElement('button');
    tab.className = 'doc-tab' + (idx === 0 ? ' active' : '');
    tab.textContent = doc.label;
    tab.onclick = () => showDoc(idx);
    tabsEl.appendChild(tab);

    // Page
    const page = document.createElement('div');
    page.className = 'doc-page';
    page.id = 'docPage' + idx;
    page.style.display = idx === 0 ? '' : 'none';
    page.innerHTML = doc.html;
    containerEl.appendChild(page);
  });

  currentDocIdx = 0;
}

function showDoc(idx) {
  document.querySelectorAll('.doc-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.doc-page').forEach((p, i) => p.style.display = i === idx ? '' : 'none');
  currentDocIdx = idx;
}

function printCurrent() {
  // Show only current doc for printing
  document.querySelectorAll('.doc-page').forEach((p, i) => {
    p.style.display = i === currentDocIdx ? '' : 'none';
  });
  window.print();
}

function printAll() {
  document.querySelectorAll('.doc-page').forEach(p => p.style.display = '');
  window.print();
  // Restore
  setTimeout(() => showDoc(currentDocIdx), 500);
}
