/* helpers */
const n=x=>(x===null||x===undefined||x==='')?0:+x;
const rS=a=>a.reduce((s,x)=>s+n(x),0);
const cS=(items,c)=>items.reduce((s,it)=>s+n(it.v[c]),0);
function fm(x){if(x===null||x===undefined||x==='')return'';const v=+x;return isNaN(v)?'':v.toLocaleString('zh-TW')}
const fp=p=>(p*100).toFixed(2)+'%';
const SKEY='exp115v4';

function doSave(){
  try{
    localStorage.setItem(SKEY,JSON.stringify({mainData,empData,miscData,persData}));
    const p=document.getElementById('savePill');p.textContent='✓ 已儲存';p.className='save-pill saved';
    clearTimeout(p._t);p._t=setTimeout(()=>{p.textContent='● 自動儲存';p.className='save-pill'},2200);

}
function doLoad(){
  try{const s=localStorage.getItem(SKEY);if(s){const d=JSON.parse(s);if(d.mainData)mainData=d.mainData;if(d.empData)empData=d.empData;if(d.miscData)miscData=d.miscData;if(d.persData)persData=d.persData;}}catch(e){}

const TABS=['main','emp','misc','personal'];
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',TABS[i]===name));

function mkHead(showId=true){
  const thead=document.createElement('thead');const tr=document.createElement('tr');
  if(showId)tr.innerHTML+=`<th class="th-id">序</th>`;
  tr.innerHTML+=`<th class="th-name">項目</th>`;
  MONTHS.forEach(m=>tr.innerHTML+=`<th>${m}</th>`);
  tr.innerHTML+=`<th class="th-tot">合計</th><th class="th-pct">百分比</th>`;
  thead.appendChild(tr);return thead;
}

function mkInput(val,cb){
  const inp=document.createElement('input');inp.type='text';
  inp.className='ci'+(val<0?' neg-val':'');
  inp.value=val!==null?fm(val):'';
  inp.addEventListener('focus',e=>e.target.select());
  inp.addEventListener('change',e=>{
    const raw=e.target.value.replace(/,/g,'').trim();
    const num=raw===''?null:+raw;
    e.target.value=num!==null?fm(num):'';
    e.target.className='ci'+(num<0?' neg-val':'');
    cb(isNaN(num)?null:num);
  });
  return inp;
}

function addMainItem(){

  '技術加給': {target:'職務加給+技術加給', sign:+1},
  '特休加給': {target:'職務加給+技術加給', sign:+1},
  '平日加班給薪(1-2HR)': {target:'加班費', sign:+1},
  '平日加班給薪(3~5HR)': {target:'加班費', sign:+1},
  '假日加班給薪':         {target:'加班費', sign:+1},
  '事假':                 {target:'請假扣款', sign:-1},
  '病假':                 {target:'請假扣款', sign:-1},
  '曠職':                 {target:'請假扣款', sign:-1},
  '勞保費(自付額)':       {target:'勞保費(自付額)', sign:-1},
  '健保費(自付額)':       {target:'健保費(自付額)', sign:-1},
  '代扣所得稅':           {target:'代扣所得稅', sign:-1},
  '其他代扣':             {target:'代扣所得稅', sign:-1},
};

function ensureEmpItems(items){
  // 確保 items 包含所有標準項目（缺的補上）；保留現有資料
  const byName = new Map(items.map(it=>[it.name, it]));
  const result = [];
  EMP_ITEM_TEMPLATE.forEach(name=>{
    if(byName.has(name)){
      result.push(byName.get(name));
      byName.delete(name);
    } else {
      result.push({name, v:new Array(12).fill(null)});
    }
  });
  // 把不在 template 裡的（使用者自訂的）保留在最後
  byName.forEach(it=>result.push(it));
  return result;
}

// 將該月份的某個標準項目欄位 += value（null 變成數字、原有數字累加）
function addEmpItemValue(items, name, monthIdx, value){
  if(value==null||isNaN(value)) return;
  const it = items.find(x=>x.name===name);
  if(!it) return;
  const cur = it.v[monthIdx];
  it.v[monthIdx] = Math.round((cur==null?0:cur) + value);
}

function processXLS(buf, fname){
  const log=document.getElementById('importLog');
  try{
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});

    // ── 取員工姓名 (從「基本資料」或「支領表」或檔名) ──
    let empName=null;
    const nameSheet = wb.SheetNames.find(s=>s==='基本資料') || wb.SheetNames.find(s=>s==='支領表');
    if(nameSheet){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[nameSheet],{header:1,defval:null});
      for(const r of rows){
        if((r[3]==='姓名：'||r[3]==='姓名:'||r[3]==='姓名')&&r[4]){empName=String(r[4]).trim();break;}
        if(typeof r[0]==='string'&&r[0].replace(/\s/g,'').startsWith('薪工資受領人姓名')&&r[1]){empName=String(r[1]).trim();break;}
      }
    }
    if(!empName){
      const fnMatch = fname.match(/[一-鿿]{2,4}(?=薪資|薪工資)/);
      if(fnMatch) empName = fnMatch[0];
    }
    if(!empName){addBadge(log,'err',`❌ ${fname}：無法讀取員工姓名`);return;}

    // ── 比對 / 建立員工 ──
    let ei=empData.employees.findIndex(emp=>{
      const clean=emp.name.replace(/^[a-z]\.\s*/,'').replace(/[（(].*[)）]/,'').trim();
      return clean===empName||clean.includes(empName)||empName.includes(clean);
    });
    let createdEmp=false;
    if(ei<0){
      const letters=['a','b','c','d','e','f','g','h','i','j','k','l','m','n'];
      const letter=letters[empData.employees.length]||'x';
      empData.employees.push({
        key:empName.toLowerCase().replace(/\s/g,''),
        name:`${letter}. ${empName}`,
        items: ensureEmpItems([])
      });
      ei = empData.employees.length - 1;
      createdEmp = true;
    } else {
      // 確保有所有標準欄位（原有資料保留）
      empData.employees[ei].items = ensureEmpItems(empData.employees[ei].items);
    }
    const items = empData.employees[ei].items;

    // ── 逐月解析 sheet "01"~"12" 細項 ──
    const monthlyTotals = new Array(12).fill(null);
    let monthsImported = 0;

    for(let m=1;m<=12;m++){
      const sheetKey = String(m).padStart(2,'0');
      const ws = wb.Sheets[sheetKey];
      if(!ws) continue;
      const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null});

      // 先清空該月所有已知標準項目（覆蓋而非累加）
      EMP_ITEM_TEMPLATE.forEach(name=>{
        const it = items.find(x=>x.name===name);
        if(it) it.v[m-1] = null;
      });

      let hadData = false;
      let monthSum = 0; // 給/扣總和（薪資總額）
      for(const r of rows){
        if(!r) continue;
        const label = typeof r[1]==='string' ? r[1].trim() : null;
        const give = (typeof r[2]==='number') ? r[2] : null;
        const deduct = (typeof r[3]==='number') ? r[3] : null;
        if(!label) continue;
        const map = XLS_ITEM_MAP[label];
        if(!map) continue;

        const value = (give!=null) ? give : (deduct!=null ? deduct : null);
        if(value==null) continue;

        addEmpItemValue(items, map.target, m-1, value * map.sign);
        monthSum += value * map.sign;
        hadData = true;

        // 勞退 6% 特別處理：xls 裡是「應領金額合計」之後另外列在備註，需特別找
      }

      // 找「勞6%保退休金」(通常在 row 20 附近)
      for(const r of rows){
        if(!r) continue;
        const c1 = typeof r[1]==='string' ? r[1] : '';
        if(c1.includes('勞6%')||c1.includes('提撥勞')){
          const v = (typeof r[2]==='number') ? r[2] : null;
          if(v!=null) addEmpItemValue(items, '勞退6%', m-1, v);
          break;
        }
      }

      // 找「實付金額」當月份總計 (給「公司基本固定開銷」用)
      for(const r of rows){
        if(!r) continue;
        const c1 = typeof r[1]==='string' ? r[1] : '';
        if(c1.includes('實付金額')){
          const v = (typeof r[3]==='number') ? r[3] : (typeof r[2]==='number' ? r[2] : null);
          if(v!=null){monthlyTotals[m-1] = Math.round(v); break;}
        }
      }
      if(monthlyTotals[m-1]==null && hadData) monthlyTotals[m-1] = Math.round(monthSum);
      if(hadData) monthsImported++;
    }

    // ── 處理基本資料的獎金行 (年終/開工/端午/中秋 → 三節 / 年終獎金) ──
    if(nameSheet){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[nameSheet],{header:1,defval:null});
      const BONUS_MAP = {
        '年終獎金': {month:1,  target:'年終獎金'},
        '開工獎金': {month:2,  target:'三節'},
        '端午獎金': {month:6,  target:'三節'},
        '中秋獎金': {month:9,  target:'三節'},
      };
      for(const r of rows){
        const c0 = typeof r[0]==='string' ? r[0] : null;
        const c2 = typeof r[2]==='number' ? r[2] : null;
        if(!c0||c2==null) continue;
        const stripped = c0.replace(/\d+/g,'').trim();
        const bKey = Object.keys(BONUS_MAP).find(k=>stripped.includes(k));
        if(!bKey) continue;
        const cfg = BONUS_MAP[bKey];
        addEmpItemValue(items, cfg.target, cfg.month-1, c2);
        // 也把獎金加到該月「公司基本固定開銷」總計
        monthlyTotals[cfg.month-1] = (monthlyTotals[cfg.month-1]||0) + Math.round(c2);
      }
    }

    // ── 更新「公司基本固定開銷」對應列 ──
    let mi=mainData.items.findIndex(it=>it.name.includes(empName));
    let createdMain=false;
    if(mi<0){
      const newId = Math.max(...mainData.items.map(x=>x.id||0)) + 1;
      mainData.items.push({id:newId, name:`薪資支出-${empName}`, v:[...monthlyTotals]});
      createdMain = true;
    } else {
      // 只覆蓋有匯入到的月份，沒匯入的保留原值
      monthlyTotals.forEach((v,idx)=>{ if(v!=null) mainData.items[mi].v[idx] = v; });
    }

    renderEmpTabs();renderMain();doSave();

    const filled = monthlyTotals.filter(v=>v!=null).length;
    const tag = (createdMain||createdEmp) ? '（自動新增員工列）' : '';
    addBadge(log,'ok',`✅ ${empName}：細項已匯入 ${monthsImported} 個月 / 總計填入 ${filled} 個月 ${tag}`);
  }catch(err){
    addBadge(log,'err',`❌ ${fname}：解析失敗 (${err.message})`);
  }
}
function addBadge(log,cls,txt){
  const d=document.createElement('div');d.className=`imp-badge ${cls}`;d.textContent=txt;log.appendChild(d);
}

/* EXPORT / RESET */
function exportJSON(){
  const b=new Blob([JSON.stringify({mainData,empData,miscData,persData},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='月支出_115年v2.json';a.click();
}
function resetAll(){if(confirm('確定要重設所有資料回初始值？此操作無法還原。')){localStorage.removeItem(SKEY);location.reload();}}

/* INIT */
doLoad();renderMain();renderEmpTabs();renderMisc();renderPers();
</script>
