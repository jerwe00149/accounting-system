name: Deploy to Cloudflare Pages

# Auto-deploys the accounting-pages/ directory to the arch-accounting Cloudflare Pages
# project whenever main is pushed (or on manual dispatch).
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN — token with "Cloudflare Pages: Edit" permission.
#     Create at https://dash.cloudflare.com/profile/api-tokens (template: "Edit Cloudflare Pages")
#     then add it under repo → Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - 'accounting-pages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Remove .git so wrangler can't read commit metadata (CJK in commit
      # author / message breaks the HTTP header ByteString encoding).
      - name: Strip git metadata
        run: rm -rf .git

      - name: Debug — find 輪 in environment
        run: |
          echo "=== GitHub event JSON ==="
          cat "$GITHUB_EVENT_PATH" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          def find(obj, path=''):
              if isinstance(obj, str):
                  if any(ord(c) > 127 for c in obj):
                      print(f'  {path} = {obj!r}')
              elif isinstance(obj, dict):
                  for k, v in obj.items(): find(v, f'{path}.{k}')
              elif isinstance(obj, list):
                  for i, v in enumerate(obj): find(v, f'{path}[{i}]')
          find(d)
          "
          echo ""
          echo "=== env vars with non-ASCII ==="
          env | python3 -c "
          import sys
          for line in sys.stdin:
            if any(ord(c) > 127 for c in line):
              print(line.rstrip())
          "
          echo "(no env var with CJK chars if blank)"
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9145b005da7045e103f94704bc2038c6
          projectName: arch-accounting
          directory: accounting-pages
          branch: main
