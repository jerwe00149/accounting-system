name: Deploy to Cloudflare Pages

# Auto-deploys the accounting-pages/ directory to the arch-accounting Cloudflare Pages
# project whenever main is pushed (or on manual dispatch).
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN — token with "Cloudflare Pages: Edit" permission.
#     Create at https://dash.cloudflare.com/profile/api-tokens (template: "Edit Cloudflare Pages")
#     then add it under repo → Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - 'accounting-pages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Remove .git so wrangler can't read commit metadata (CJK in commit
      # author / message breaks the HTTP header ByteString encoding).
      - name: Strip git metadata
        run: rm -rf .git

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9145b005da7045e103f94704bc2038c6
          # Pin wrangler 4.78.0 — 4.92.0 has a regression that throws
          # "Cannot convert argument to a ByteString" on this repo (probably
          # reads CJK chars from somewhere into an HTTP header). 4.78.0 works.
          wranglerVersion: '4.78.0'
          # Pass --commit-message explicitly (ASCII only). Wrangler otherwise auto-reads
          # the latest commit message via git, and chokes if it contains non-ASCII chars
          # (commits HTTP headers must be ByteString; CJK chars > 0xFF break that).
          command: pages deploy accounting-pages --project-name=arch-accounting --branch=main --commit-dirty=true --commit-message="Auto-deploy from GitHub Actions" --commit-hash=${{ github.sha }}
