name: Deploy to Cloudflare Pages

# Auto-deploys the accounting-pages/ directory to the arch-accounting Cloudflare Pages
# project whenever main is pushed (or on manual dispatch).
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN — token with "Cloudflare Pages: Edit" permission.
#     Create at https://dash.cloudflare.com/profile/api-tokens (template: "Edit Cloudflare Pages")
#     then add it under repo → Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - 'accounting-pages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Remove .git so wrangler can't read commit metadata (CJK in commit
      # author / message breaks the HTTP header ByteString encoding).
      - name: Strip git metadata
        run: rm -rf .git

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9145b005da7045e103f94704bc2038c6
          wranglerVersion: '4.78.0'
          command: pages deploy accounting-pages --project-name=arch-accounting --branch=main --commit-dirty=true
