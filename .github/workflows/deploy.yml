name: Deploy to Cloudflare Pages

# Auto-deploys the accounting-pages/ directory to the arch-accounting Cloudflare Pages
# project whenever main is pushed (or on manual dispatch).
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN — token with "Cloudflare Pages: Edit" permission.
#     Create at https://dash.cloudflare.com/profile/api-tokens (template: "Edit Cloudflare Pages")
#     then add it under repo → Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - 'accounting-pages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Remove .git so wrangler can't read commit metadata (CJK in commit
      # author / message breaks the HTTP header ByteString encoding).
      - name: Strip git metadata
        run: rm -rf .git

      - name: Sanitize event JSON (remove CJK author/committer names)
        run: |
          python3 -c "
          import json, os
          path = os.environ['GITHUB_EVENT_PATH']
          with open(path) as f: d = json.load(f)
          def sanitize(obj):
              if isinstance(obj, dict):
                  for k in ('name', 'email', 'username'):
                      if k in obj and isinstance(obj[k], str):
                          obj[k] = ''.join(c if ord(c) < 128 else '?' for c in obj[k])
                  for v in obj.values(): sanitize(v)
              elif isinstance(obj, list):
                  for item in obj: sanitize(item)
          sanitize(d)
          with open(path, 'w') as f: json.dump(d, f)
          print('Event JSON sanitized')
          "

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9145b005da7045e103f94704bc2038c6
          wranglerVersion: '4.78.0'
          command: pages deploy accounting-pages --project-name=arch-accounting --branch=main --commit-dirty=true
